AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: 
  This CloudFormation template will deploy a full CI/CD pipeline for SSO
  Sync. It includes building with AWS CodeBuild, publishing to a
  staging (private) AWS Serverless Application Repository (SAR), and test within
  this same account via AWS CloudFormation.

Parameters:
   
  RepoName:
    Description: The repo name on github
    Default: ssosync
    Type: String
  
  OwnerName:
    Description: The user/organization that owns the above repo
    Default: awslabs
    Type: String

  BranchName:
    Description: The branch name on github
    Default: master
    Type: String
 
  GitHubOAuthToken: 
    Description: Create a token with 'repo' and 'admin:repo_hook' permissions here https://github.com/settings/tokens
    Type: String
    NoEcho: True

  SecretsConfig:
    Description:  Output from the secrets.yaml stack
    Type: String
    AllowedPattern: '(arn:aws:secretsmanager:((us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9/_+=.@-]{1,512})(,(arn:aws:secretsmanager:((us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9/_+=.@-]{1,512})){2}((,arn:aws:secretsmanager:((us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9/_+=.@-]{1,512})|(,"")){5}(,arn:aws:kms:((us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d):[0-9]{12}:key/[a-zA-Z0-9/_+=.@-]{1,512})'


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: GitHub Repo
        Parameters:
          - OwnerName
          - RepoName
          - BranchName
      - Label:
          default: GitHub Auth
        Parameters:
          - GitHubOAuthToken

    ParameterLabels:
      RepoName:
        default: "Repository Name"
      OwnerName:
        default: "Repository Owner"
      BranchName:
        default: "Branch Name"
      GitHubOAuthToken:
        default: "GitHub OAuth Token"
      SecretsConfig:
        default: "TestConfig from the output of secrets.yaml"

Resources:
  CodePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    Properties: 
      RetentionInDays: 30

  ArtifactBucketKey:
    Type: AWS::KMS::Key
    Properties: 
      Description: Key for this CodePipeline
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
          Action: 'kms:*'
          Resource: '*'

  ArtifactBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt ArtifactBucketKey.Arn 
            BucketKeyEnabled: true

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['s3:GetObject']
          Effect: Allow
          Principal:
            Service: 'serverlessrepo.amazonaws.com'
          Resource:
          - !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            StringEquals: 
              aws:SourceAccount: !Ref AWS::AccountId
        - Sid: DenyUnEncryptedObjectUploads
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            StringNotEquals: 
              s3:x-amz-server-side-encryption: aws:kms
        - Sid: RequireKMSEncryption
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition:
            StringNotLikeIfExists:
              s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ArtifactBucketKey.Arn
        - Sid: DenyInsecureConnections
          Effect: Deny
          Principal: "*"
          Action: "s3:*"
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            Bool: 
              aws:SecureTransport: false

  AppBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['s3:GetObject']
          Effect: Allow
          Principal:
            Service: 'serverlessrepo.amazonaws.com'
          Resource: 
          - !Sub ${AppBucket.Arn}/*
          Condition:
            StringEquals:  
              aws:SourceAccount: !Ref AWS::AccountId

  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: SSOSync
      # QUEUED (V2 only): no execution is superseded, and only one execution
      # can be in a stage at a time. Everything that uses the shared
      # TestAccountExecution stack and Identity Store is in the one Tests
      # stage, so a newer run waits at its entrance until the older run leaves
      # it (succeeded or failed); overlapping runs used to interfere (seen as
      # intermittent UserGroupOperations S6 failures).
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore: 
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey: 
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              Namespace: GitHub
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Version: 1
                Provider: GitHub
              OutputArtifacts:
                - Name: Source
              Configuration:
                Owner: !Ref OwnerName
                Repo: !Ref RepoName
                Branch: !Ref BranchName
                OAuthToken: !Ref GitHubOAuthToken
                # The repository webhook starts the pipeline; polling (the
                # default, true) started a second execution for every push.
                PollForSourceChanges: false
        - Name: Build
          Actions:
            - Name: InspectorScan
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: InspectorScan
                Version: '1'
              RunOrder: 1
              Configuration:
                InspectorRunMode: SourceCodeScan
                CriticalThreshold: 0
                HighThreshold: 1
                MediumThreshold: 2
                LowThreshold: 3
              InputArtifacts:
                - Name: Source
              OutputArtifacts:
                - Name: Vulnerabilities
              Region: !Ref AWS::Region
            - Name: Git-Metadata
              Namespace: Git
              InputArtifacts:
                - Name: Source
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              OutputArtifacts:
                - Name: GitVars
              RunOrder: 2
              Configuration:
                ProjectName: !Ref GitMetadata
                PrimarySource: Source
            - Name: GoLang-Build
              InputArtifacts:
                - Name: Source
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              OutputArtifacts:
                - Name: Built
              RunOrder: 3
              Configuration:
                ProjectName: !Ref CodeBuildApp
                PrimarySource: Source
                EnvironmentVariables: '[{"name":"GitTag","value":"#{Git.Tag}","type":"PLAINTEXT"},{"name":"GitCommit","value":"#{Git.CommitId}","type":"PLAINTEXT"}]'
            - Name: SAM-Package-SAR-Stage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 4
              Configuration:
                ProjectName: !Ref CodeBuildPackage
                PrimarySource: Source
                EnvironmentVariables: '[{"name":"GitTag","value":"#{Git.Tag}","type":"PLAINTEXT"},{"name":"GitVersionHash","value":"#{Git.CommitHash}","type":"PLAINTEXT"}]'
              OutputArtifacts:
                - Name: Packaged
              InputArtifacts:
                - Name: Built
                - Name: Source
            - Name: Configurations
              Namespace: RC
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 5
              Configuration:
                ProjectName: !Ref CodeBuildStaging
                PrimarySource: Source
                EnvironmentVariables: '[{"name":"GitTag","value":"#{Git.Tag}","type":"PLAINTEXT"},{"name":"GitVersionHash","value":"#{Git.CommitHash}","type":"PLAINTEXT"}]'
              OutputArtifacts:
                - Name: Tests
              InputArtifacts:
                - Name: Source
                - Name: Packaged
                - Name: Built
        # All tests share the TestAccountExecution stack and the Identity Store,
        # so they run in one stage: with QUEUED only one execution can be in a
        # stage, so runs no longer overlap. Actions are prefixed with the block
        # they belong to and run strictly in sequence (RunOrder).
        - Name: Tests
          Actions:
            # Workload Identity Federation (keyless, issue #345) with no admin (the
            # service account acts as itself, issue #192), first so a keyless
            # failure fails fast: deploy from deploy/wif-<AccountId>.json (no key,
            # no admin, the customer id, RoleName SSOSync_ExecutionRole), then the
            # Lambda, CLI and CodePipeline tests. See tests/wif_account_execution/.
            - Name: Deploy-WIFAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                TemplatePath: 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: WIFAuth-Lambda
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildWIFLambda
              OutputArtifacts:
                - Name: WIFLambda
              InputArtifacts:
                - Name: Tests
            - Name: WIFAuth-CLI
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 3
              Configuration:
                ProjectName: !Ref CodeBuildWIFCLI
              OutputArtifacts:
                - Name: WIFCLI
              InputArtifacts:
                - Name: Tests
            - Name: WIFAuth-CodePipeline
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 4
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: WIFCodePipeline
              InputArtifacts:
                - Name: Tests
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - Name: CleanUp-WIFAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 5
            # Legacy auth (stored credentials): the service-account key and an admin
            # to act on behalf of (deploy/developer.json).
            - Name: Deploy-LegacyAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/developer.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 6
            - Name: LegacyAuth-Lambda
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 7
              Configuration:
                ProjectName: !Ref CodeBuildSmokeLambda
                PrimarySource: Source
              OutputArtifacts:
                - Name: SmokeLambda
              InputArtifacts:
                - Name: Tests
            - Name: LegacyAuth-CLI
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 8
              Configuration:
                ProjectName: !Ref CodeBuildSmokeCLI
              OutputArtifacts:
                - Name: SmokeCLI
              InputArtifacts:
                - Name: Tests
            - Name: LegacyAuth-CodePipeline
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 9
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: SmokeCodePipeline
              InputArtifacts:
                - Name: Tests
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - Name: CleanUp-LegacyAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 10
            # Attribute-map integration tests (cicd/tests/attribute_map/). They share
            # one Identity Store, so every action runs in sequence (distinct RunOrder).
            # Each live test resets the Identity Store to tests/attribute_map/baseline/.
            # Keyless deployment (deploy/wif-<AccountId>.json): the CLI tests run ssosync
            # keyless with its SSOSync* secrets, the Lambda tests invoke SSOSyncFunction.
            - Name: Deploy-AttributeMap
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 11
            - Name: AttributeMap-InvalidMap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 12
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapInvalidMap
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapInvalidMap
            - Name: AttributeMap-DefaultMap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 13
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapDefaultMap
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapDefaultMap
            - Name: AttributeMap-Determinism
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 14
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapDeterminism
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapDeterminism
            - Name: AttributeMap-RichMap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 15
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapRichMap
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapRichMap
            - Name: AttributeMap-ValidationWarnings
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 16
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapValidationWarnings
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapValidationWarnings
            - Name: AttributeMap-UsernameRemap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 17
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapUsernameRemap
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapUsernameRemap
            - Name: AttributeMap-ManagerOptIn
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 18
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapManagerOptIn
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapManagerOptIn
            - Name: AttributeMap-LambdaDefaultMap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 19
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapLambdaDefault
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapLambdaDefault
            # Redeploy the (keyless) function with maps/rich.json inline in ATTRIBUTE_MAP.
            - Name: AttributeMap-DeployInlineAttributeMap
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/attributemap-${AWS::AccountId}.json'
                TemplatePath: 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 20
            - Name: AttributeMap-LambdaInlineMap
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 21
              Configuration:
                ProjectName: !Ref CodeBuildAttrMapLambdaInlineMap
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: AttrMapLambdaInlineMap
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - Name: CleanUp-AttributeMap
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 22
            # Functional tests against the live tenant.
            # Keyless deployment (deploy/wif-<AccountId>.json): ssosync runs keyless with its SSOSync* secrets.
            - Name: Deploy-Functional
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 23
            # Live proof of getUserOperations/getGroupOperations (issue #383):
            # expected IssuerArn == the real ExternalId Issuer, managed records
            # converge, multi-ExternalId records use this tenant's entry, and the
            # ExternalId-change path (Recreate/UpdateForced) works.
            # See cicd/tests/user_group_operations/run.sh.
            - Name: UserGroupOperations
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 24
              Configuration:
                ProjectName: !Ref CodeBuildUserGroupOperations
              OutputArtifacts:
                - Name: UserGroupOperations
              InputArtifacts:
                - Name: Tests
            # Quick-start templates (quick-start/*.yaml, wif-auth/, legacy-auth/)
            # against the build under test. Configurations (tests/quick_start/
            # build.py) wrote a wrapper per test that deploys the quick-start as a
            # nested stack, passing every secret as a Secrets Manager dynamic
            # reference, and per-account parameter files of secret Arns.
            # QuickStart-Package uploads the nested templates (only) to this
            # account's artifact bucket. Each quick-start then updates the same
            # QuickStartTests stack and the function is invoked. The order moves
            # from the classic quick-starts (legacy SSOSync application) to
            # quick-start/next-gen/ (ssosync, issue #399): a customer's upgrade,
            # replacing the nested applications in place.
            # Every quick-start creates the SSOSync* secrets, which
            # TestAccountExecution (App + secrets) also creates, so that stack is
            # removed first.
            - Name: CleanUp-Functional
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 25
            - Name: QuickStart-Package
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 26
              Configuration:
                ProjectName: !Ref CodeBuildQuickStartPackage
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: QuickStarts
            - Name: Deploy-QuickStart-SingleAccount
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: QuickStartTests
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccount-${AWS::AccountId}.json'
                TemplatePath: 'QuickStarts::packaged/SingleAccount.yml'
              InputArtifacts:
                - Name: Tests
                - Name: QuickStarts
              RunOrder: 27
            - Name: QuickStart-SingleAccount
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 28
              Configuration:
                FunctionName: SSOSync
              InputArtifacts:
                - Name: Tests
            - Name: Deploy-QuickStart-SingleAccountAttributeMap
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: QuickStartTests
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccountAttributeMap-${AWS::AccountId}.json'
                TemplatePath: 'QuickStarts::packaged/SingleAccountAttributeMap.yml'
              InputArtifacts:
                - Name: Tests
                - Name: QuickStarts
              RunOrder: 29
            - Name: QuickStart-SingleAccountAttributeMap
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 30
              Configuration:
                FunctionName: SSOSync
              InputArtifacts:
                - Name: Tests
            - Name: Deploy-QuickStart-NextGenSingleAccount
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: QuickStartTests
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/NextGenSingleAccount-${AWS::AccountId}.json'
                TemplatePath: 'QuickStarts::packaged/NextGenSingleAccount.yml'
              InputArtifacts:
                - Name: Tests
                - Name: QuickStarts
              RunOrder: 31
            - Name: QuickStart-NextGenSingleAccount
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 32
              Configuration:
                FunctionName: SSOSyncNG
              InputArtifacts:
                - Name: Tests
            - Name: Deploy-QuickStart-NextGenSingleAccountAttributeMap
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: QuickStartTests
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/NextGenSingleAccountAttributeMap-${AWS::AccountId}.json'
                TemplatePath: 'QuickStarts::packaged/NextGenSingleAccountAttributeMap.yml'
              InputArtifacts:
                - Name: Tests
                - Name: QuickStarts
              RunOrder: 33
            - Name: QuickStart-NextGenSingleAccountAttributeMap
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 34
              Configuration:
                FunctionName: SSOSyncNG
              InputArtifacts:
                - Name: Tests
            - Name: CleanUp-QuickStart
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: QuickStartTests
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 35
  GitMetadata:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: SSOSync-Git-Metadata
      Description: Build project for SSOSync
      ServiceRole: !Ref CodeBuildAppRole
      Source:
        Type: CODEPIPELINE
        BuildSpec: "cicd/build/gitvars/buildspec.yml"
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ARTIFACT_S3_BUCKET
            Value: !Sub ${ArtifactBucket}
          - Name: GitRepo
            Value: !Sub "https://github.com/${OwnerName}/${RepoName}"
          - Name: GitBranch
            Value: !Ref BranchName
      Artifacts:
        Name: SSOSync
        Type: CODEPIPELINE
