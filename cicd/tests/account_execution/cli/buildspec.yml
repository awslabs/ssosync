version: 0.2

env:
  secrets-manager:
    GoogleAdminEmail: SSOSyncGoogleAdminEmail
    SCIMEndpointUrl: SSOSyncSCIMEndpointUrl
    SCIMAccessToken: SSOSyncSCIMAccessToken
  variables:
    ExpectedExitState: 0
  
phases:
  build:
    commands:
      - ./ssosync --version
      # The key file is a secret: write it, never print it (and no `env` dump,
      # as this project holds the SCIM token).
      - aws secretsmanager  get-secret-value --secret-id=SSOSyncGoogleCredentials --query SecretString --output text | jq '.' > credentials.json

      - ./ssosync -t "${SCIMAccessToken}" -e "${SCIMEndpointUrl}" -u "${GoogleAdminEmail}" -s "groups" -g "name:AWS*"; ExitState=$?
      - echo "ExitState= ${ExitState}"
      - echo "ExpectedExitState= ${ExpectedExitState}"

      - |
        if expr "${ExitState}" : "${ExpectedExitState}" >/dev/null; then
          echo "We got what we expected"
          exit 0
        else
          echo "We didn't get what we expected"
          exit 1
        fi

