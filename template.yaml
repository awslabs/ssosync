AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AWS IAM Identity Center (Successor to AWS Single Sign-On)
        Parameters:
          - SCIMEndpointUrl
          - SCIMEndpointAccessToken
      - Label:
          default: Google Workspace Credentials 
        Parameters:
          - GoogleCustomerId
          - GoogleAdminEmail
          - GoogleCredentials
          - GoogleImpersonateServiceAccount
          - GoogleWIFConfig
      - Label:
          default: Sync Configuration
        Parameters:
          - GoogleGroupMatch
          - GoogleUserMatch
          - GoogleUserMatch
          - IgnoreUsers
          - IgnoreGroups
          - SyncSuspended
          - PrecacheOrgUnits
          - ExternalIdChange
          - RetainUnmatched
          - AttributeMap
      - Label:
          default: "Lambda Configuration"
        Parameters:
          - FunctionName
          - RoleName
          - ScheduleExpression
          - DryRun
          - MemorySize
          - TimeOut
      - Label:
          default: Log Configuration
        Parameters:
          - LogLevel
          - LogFormat
          - LogRetention
      - Label:
          default: Which pattern are we deploying? The app with secrets, the app but using existing secrets, or just the secrets.
        Parameters:
          - DeployPattern
          - AppAccount
          - KMSKey
      - Label:
          default: "Configuration options for users_groups Mode only, to be deprecated in version 3.x"
        Parameters:
          - SyncMethod
          - IncludeGroups
      - Label:
          default: "Deprecated Parameters, to be deprecated in version 3.x"
        Parameters:
          - IdentityStoreID
          - Region


  AWS::ServerlessRepo::Application:
    Name: ssosync
    Description: Helping you populate AWS SSO directly with your Google Apps users.
    Author: Sebastian Doell
    SpdxLicenseId: Apache-2.0
    # paths are relative to .aws-sam/build directory
    LicenseUrl: LICENSE
    ReadmeUrl: SAR.md
    Labels: [serverless, sso, lambda, scim]
    HomePageUrl: https://github.com/awslabs/ssosync
    # Update the semantic version and run sam publish to publish a new version of your app
    SemanticVersion: 1.0.0
    # best practice is to use git tags for each release and link to the version tag as your source code URL
    SourceCodeUrl: https://github.com/awslabs/ssosync

Parameters:
  DeployPattern:
    Type: String
    Description: |
      App + secrets (default); you provide the values for the secrets and the everything is setup.
      App only; Deploys the app and to use the secrets you provide the arn for, that exist in this account.
      App for cross-account; Deploys the app and to use the secrets you provide the arn for, also requires details of the KMS key used to encrypt them.
      Secrets only; Just creates the secrets.
      Secrets for cross-account; Just creates the secrets, and encrypts them with a KMS key and share them with the target account.
    Default: App + secrets
    AllowedValues:
      - App + secrets
      - App only
      - App for cross-account
      - Secrets only
      - Secrets for cross-account

  AppAccount:
    Type: String
    Description: |
      If using [Secrets for cross-account] this is the AWS account id into which you will be deploying the SSOSync app?
    Default: ""
    AllowedPattern: '(?!.*\s)|(\d{12})'

  KMSKey:
    Type: String
    Description: |
      If using [App for cross-account] this must be the Arn of the KMS key used to encrypt the secrets.
    Default: ""
    AllowedPattern: '(?!.*\s)|(arn:aws:kms:((us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d):[0-9]{12}:key/[a-zA-Z0-9/_+=.@-]{1,512})'
    
  FunctionName:
    Type: String
    Description: |
      [optional] Specify the name you want to us for this deployment, if you want to trigger SSOSync as part of a pipeline or other automation this will ensure a consistent arn to call. leave empty for default behaviour.
    Default: ""
    AllowedPattern: '(?!.*\s)|[a-zA-Z0-9-_]{1,140}'

  RoleName:
    Type: String
    Description: |
      [optional] Name of the IAM role the function runs as. Leave empty to have CloudFormation generate one (the default). Set it to get a predictable name that survives redeployments, for example to set up keyless Google authentication (Workload Identity Federation), which trusts the role by name. IAM role names are global in the account: use a different name for each ssosync deployment.
    Default: ""
    AllowedPattern: '(?!.*\s)|[a-zA-Z0-9+=,.@_-]{1,64}'
    ConstraintDescription: 'Must be empty or a valid IAM role name: up to 64 letters, digits and +=,.@_-'

  ScheduleExpression:
    Type: String
    Description: |
      [optional] Schedule for trigger the execution of ssosync (see CloudWatch schedule expressions), leave empty if you want to trigger execution by another method such as AWS CodePipeline.
    Default: rate(15 minutes)
    AllowedPattern: '(?!.*\s)|rate\((?:(?:(?:\d{2,}+|[2-9]) (?:minutes|hours|days))|(?:1 (?:minute|hour|day)))\)|(cron\((([0-9]|[1-5][0-9]|60)|\d\/([0-9]|[1-5][0-9]|60)|\*) (([0-9]|[1][0-9]|[2][0-3])|(\d\/([0-9]|[1][0-9]|[2][0-3]))|(([0-9]|[1][0-9]|[2][0-3])-([0-9]|[1][0-9]|[2][0-3]))|\*) (([1-9]|[1-2][0-9]|[3][0-1])|\d\/([1-9]|[1-2][0-9]|[3][0-1])|[1-5]W|L|\*|\?) (([1-9]|[1][1-2])|(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)|((JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV)-(FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))|(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV)(,(FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)){0,11}|\d\/([0-9]|[1][0-2])|\?|\*) ((MON|TUE|WED|THU|FRI|SAT|SUN)|(MON|TUE|WED|THU|FRI|SAT)-(TUE|WED|THU|FRI|SAT|SUN)|(MON|TUE|WED|THU|FRI|SAT)(,(TUE|WED|THU|FRI|SAT|SUN)){0,6}|[1-7]L|[1-7]#[1-5]|\?|\*) ((19[7-9][0-9]|2[0-1]\d\d)|(19[7-9][0-9]|2[0-1]\d\d)-(19[7-9][0-9]|2[0-1]\d\d)|(19[7-9][0-9]|2[0-1]\d\d)(,(19[7-9][0-9]|2[0-1]\d\d))*|\*)\))'

  LogRetention:
    Type: Number
    Description: |
      How long to retain log for, if you want to retain indefinitely, select 0
    Default: 0
    AllowedValues:
      - 0
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

  LogLevel:
    Type: String
    Description: |
      [required] Log level for Lambda function logging
    Default: warn
    AllowedValues:
      - panic
      - fatal
      - error
      - warn
      - info
      - debug
      - trace

  LogFormat:
    Type: String
    Description: |
      [required] Log format for Lambda function logging
    Default: json
    AllowedValues:
      - json
      - text

  MemorySize:
    Type: Number
    Description: |
      [required] the amount of RAM allocated to the function, within range 128-10240MB. default is 128MB.
    Default: 128
    MinValue: 128
    MaxValue: 10240
     
  TimeOut:
    Type: Number
    Description: |
      [required] Timeout for the Lambda function
    Default: 300
    MinValue: 1
    MaxValue: 900

  SyncSuspended:
    Type: String
    Description: |
      If enabled suspended users that match either the GoogleUserMatch or GoogleGroupMatch criteria they will be replicated.
    Default: ignore
    AllowedValues:
      - ignore
      - sync

  ExternalIdChange:
    Type: String
    Description: |
      When a user (in the Google Workspace Directory) is deleted and recreated, either 'update' the existing IAM Identity Store user, to preserve permission assignments or 'delete and recreate' to prevent permission inheritance.
    Default: delete/recreate
    AllowedValues:
      - delete/recreate
      - update
      
  RetainUnmatched:
    Type: String
    Description: |
      Retain all unmatched users and groups when syncing, users will not be able login without a matching user in the Google Workspace Directory.
    Default: remove
    AllowedValues:
      - remove
      - retain

  DryRun:
    Type: String
    Description: | 
      Enabled Dry Run, means the lambda will execute highlighting the changes it would make to the Identity Store, will not making any changes.
    Default: live
    AllowedValues:
      - live
      - dry-run

  PrecacheOrgUnits:
    Type: String
    Description: | 
       To reduce the volume of apis, ssosync precaches the users and groups from the Google directory. If you directory is large >10,000 users, you may wish to limit the organizational units that are precached. The default is the whole directory '/'. The parameter accpets a comma separate list of OrgUnitPaths, /OU1,/OU2/OU3 in this example all users within the tree of /OU1 and /OU2/OU3 would be precached but not from /OU2 itself. Precaching can be disable by leaving the field empty.
    Default: "/"
    AllowedPattern: '(?!.*\s)|(^\/$)|(\/[a-zA-Z0-9_\/\-'' ]{0,50})|(\/[a-zA-Z0-9_\/\-'' ]{0,50})(?:(,\/[a-zA-Z0-9_\/\-'' ]{1,50}))'

# Secrets
  GoogleCustomerId:
    Type: String
    Description: |
      Google CustomerId, retrieve from https://admin.google.com/ac/accountsettings/profile, [Required from v3.x] or the Arn of a secret that contains it. The actual customer ID (not my_customer) is required for keyless authentication and when GoogleAdminEmail is empty.
    Default: "my_customer"
    AllowedPattern: '(my_customer)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(?:C[0-9a-zA-Z]{8})'

  GoogleCredentials:
    Type: String
    Description: |
      Service-account key authentication (the default): the service account key to log into Google (content of credentials.json) or the Arn of a secret that contains it. Leave empty only when using keyless authentication (GoogleImpersonateServiceAccount).
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(\{(\s)*(".*")(\s)*:(\s)*(".*")(\s)*\})'
    NoEcho: true

  GoogleImpersonateServiceAccount:
    Type: String
    Description: |
      [optional] Keyless authentication (Workload Identity Federation): the email of the Google service account to impersonate, or the Arn of a secret that contains it. Setting it replaces GoogleCredentials and GoogleAdminEmail, which must then be empty (the service account acts as itself, with a read-only Workspace admin role), and requires the actual GoogleCustomerId (not my_customer).
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(?:[a-z0-9][a-z0-9-]{4,28}[a-z0-9]@[a-z0-9.-]+\.gserviceaccount\.com)'
    ConstraintDescription: 'Must be empty, a Google service account email (...@<project>.iam.gserviceaccount.com), or the Arn of a Secrets Manager secret.'

  GoogleWIFConfig:
    Type: String
    Description: |
      [optional] Keyless authentication: the Workload Identity Federation credential configuration (the external_account JSON from `gcloud iam workload-identity-pools create-cred-config --aws`), the Arn of a Secrets Manager secret, or the Arn of an SSM Parameter Store parameter that contains it. Required for keyless authentication from AWS Lambda; only used with GoogleImpersonateServiceAccount.
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(?:arn:aws:ssm:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:parameter\/[a-zA-Z0-9\/_.-]{1,2048})|(?s:\s*\{.*\}\s*)'
    ConstraintDescription: 'Must be empty, inline Workload Identity Federation configuration JSON, the Arn of a Secrets Manager secret, or the Arn of an SSM Parameter Store parameter.'

  GoogleAdminEmail:
    Type: String
    Description: |
      [optional] Legacy (key) authentication only: Google Workspace admin email for the service account to act on behalf of (domain-wide delegation), or the Arn of a secret that contains it. Must be empty with keyless authentication. Leave empty to have the service account call the Admin SDK as itself, using the admin role assigned to it; GoogleCustomerId must then be the actual customer ID (not my_customer).
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(([a-zA-Z0-9.+=_-]{0,61})@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*)'
    NoEcho: true

  SCIMEndpointUrl:
    Type: String
    Description: |
      AWS IAM Identity Center - SCIM Endpoint Url or the Arn of a secret that contains it
    AllowedPattern: '(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(https://scim.(us(-gov)?|ap|ca|cn|eu|il|me|mx|sa)-(central|(north|south)?(east|west)?)-([0-9]{1})(.amazonaws.com|.api.aws)/([A-Za-z0-9]{8,11})-([A-Za-z0-9]{4})-([A-Za-z0-9]{4})-([A-Za-z0-9]{4})-([A-Za-z0-9]{12})/scim/v2/?)'

  SCIMEndpointAccessToken:
    Type: String
    Description: |
      AWS IAM Identity Center - SCIM AccessToken or the Arn of a secret that contains it
    AllowedPattern: '(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|([0-9a-zA-Z/=+-\\]{500,620})'
    NoEcho: true

# Depreciated Secrets
  Region:
    Type: String
    Description: |
      AWS Region where AWS IAM Identity Center is enabled, NO LONGER USED only present for backward compatability.
    Default: ""
    AllowedPattern: '(?!.*\s)|(us(-gov)?|ap|ca|cn|eu|sa)-(central|(north|south)?(east|west)?)-\d'

  IdentityStoreID:
    Type: String
    Description: |
      Identifier of Identity Store in AWS IAM Identity Center, NO LONGER USED only present for backward compatability.
    Default: ""
    AllowedPattern: '(?!.*\s)|d-[1-z0-9]{10}'

# Environment Variables
  GoogleUserMatch:
    Type: String
    Description: |
      [optional] Google Workspace Users filter query parameter, a simple '*' denotes sync all users in the directory. example: 'name:John*,email:admin*', '*' or name=John Doe,email:admin*' see: https://developers.google.com/admin-sdk/directory/v1/guides/search-users, if left empty no users will be selected but if a pattern has been set for GroupMatch users that are members of the groups it matches will still be selected.
    Default: ""
    AllowedPattern: '(?!.*\s)|(\*)|(?:(?:((?:(?i)name|managerId|orgName|orgDepartment|orgCostCenter)(?:(?::[a-zA-Z0-9\-_]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")|(?:=''(?:[a-zA-Z0-9\-_ ]|\\''){1,64}'')))|((?:(?i)email|manager)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?:=''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?::[a-zA-Z0-9.\-_]{1,64}\*))))(([, ]{1,2})(?:((?:(?i)name|manager|managerId|orgName|orgDepartment|orgCostCenter)(?:(?::[a-zA-Z0-9\-_ ]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")|(?:=''(?:[a-zA-Z0-9\-_ ]|\\''){1,64}'')))|((?:(?i)email|manager)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?:=''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?::[a-zA-Z0-9.\-_]{1,64}\*)))))*)'

  GoogleGroupMatch:
    Type: String
    Description: |
      [optional] Google Workspace Groups filter query parameter, a simple '*' denotes sync all groups (and any users that are members of those groups). example: 'name:Admin*,email:aws-*', 'name=Admins' or '*' see: https://developers.google.com/admin-sdk/directory/v1/guides/search-groups, if left empty no groups will be selected.
    Default: "*"
    AllowedPattern: '(?!.*\s)|(\*)|(?:(?:((?:(?i)name)(?:(?::[a-zA-Z0-9\-_]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")|(?:=''(?:[a-zA-Z0-9\-_ ]|\\''){1,64}'')))|(?:(?i)memberkey=)(?:(?:[a-zA-Z0-9\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260})|(?:''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?:(?:[a-zA-Z0-9.\-_]{1,64}))|(?:\"[a-zA-Z0-9\-_ ]{1,64}\"))|((?:(?i)email)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?:=''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?::[a-zA-Z0-9.\-_]{1,64}\*))))(([, ]{1,2})(?:((?:(?i)name)(?:(?::[a-zA-Z0-9\-_ ]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")|(?:=''(?:[a-zA-Z0-9\-_ ]|\\''){1,64}'')))|(?:(?i)memberkey=)(?:(?:[a-zA-Z0-9\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260})|(?:''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?:(?:[a-zA-Z0-9.\-_]{1,64}))|(?:\"[a-zA-Z0-9\-_ ]{1,64}\"))|((?:(?i)email)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?:=''(?:[a-zA-Z0-9.\-_]|\\''){1,64}@[a-zA-Z0-9.\-]{5,260}'')|(?::[a-zA-Z0-9.\-_]{1,64}\*)))))*)'

  IgnoreGroups:
    Type: String
    Description: |
      [optional] Ignore these Google Workspace groups, leave empty if not required
    Default: ""
    AllowedPattern: '(?!.*\s)|((([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260}))(,(([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260})))*)'

  IgnoreUsers:
    Type: String
    Description: |
      [optional] Ignore these Google Workspace users, leave empty if not required
    Default: ""
    AllowedPattern: '(?!.*\s)|((([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260}))(,(([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260})))*)'

  IncludeGroups:
    Type: String
    Description: |
      [optional] Include only these Google Workspace groups, leave empty if not required. (Only applicable for SyncMethod user_groups)
    Default: ""
    AllowedPattern: '(?!.*\s)|((([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260}))(,(([a-zA-Z0-9.\-_'']{1,64})@([a-zA-Z0-9.\-]{5,260})))*)'

  SyncMethod:
    Type: String
    Description: Sync method to use 
    Default: groups
    AllowedValues:
      - groups
      - users_groups

  AttributeMap:
    Type: String
    Description: |
      [optional] Attribute map controlling how Google user attributes map onto IAM Identity Center (SCIM) fields (groups sync method only). Provide inline attribute-map JSON, the Arn of a Secrets Manager secret, or the Arn of an SSM Parameter Store parameter that contains it. Leave empty to use the built-in default mapping (no secret is created and ATTRIBUTE_MAP is not set). With a deployment pattern that creates secrets, inline JSON is stored in the SSOSyncAttributeMap secret.
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:arn:aws:secretsmanager:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:secret:[a-zA-Z0-9\/_+=.@-]{1,512})|(?:arn:aws:ssm:(?:(?:us(?:-gov)?|ap|ca|cn|eu|sa)-(?:central|(?:north|south)?(?:east|west)?)-\d):[0-9]{8,12}:parameter\/[a-zA-Z0-9\/_.-]{1,2048})|(?s:\s*\{.*\}\s*)'
    ConstraintDescription: 'Must be empty, inline attribute-map JSON (a JSON object), the Arn of a Secrets Manager secret, or the Arn of an SSM Parameter Store parameter.'

Conditions:
  SetFunctionName: !Not 
    - !Equals [!Ref FunctionName, "" ]
  SetRoleName: !Not
    - !Equals [!Ref RoleName, ""]
  LegacySync: !Equals [ !Ref SyncMethod, "users_groups" ]
  SetGoogleUserMatch: !And
    - !Not 
      - !Condition LegacySync
    - !Not
      - !Equals [ !Ref GoogleUserMatch, "" ]
  SetGoogleGroupMatch: !And 
    - !Not 
      - !Condition LegacySync
    - !Not
      - !Equals [ !Ref GoogleGroupMatch, "" ]
  SetIgnoreGroups: !Not
    - !Equals [ !Ref IgnoreGroups, "" ]
  SetIgnoreUsers: !Not
    - !Equals [ !Ref IgnoreUsers, "" ]
  SetIncludeGroups: !And
    - !Condition LegacySync
    - !Not
      - !Equals [!Ref IncludeGroups, ""]
  SetLogRetention: !And
    - !Condition CreateFunction
    - !Not
      - !Equals [!Ref LogRetention, 0 ]
  SetDryRun: !Equals [!Ref DryRun, "dry-run"]
  SetSyncSuspended: !Equals [!Ref SyncSuspended, "sync"]
  DisablePrecaching: !Equals [!Ref PrecacheOrgUnits, ""]
  SetForceExternalIdUpdate: !Equals [!Ref ExternalIdChange, "update"]
  SetRetainUnmatched: !Equals [!Ref RetainUnmatched, "retain"]
  # AttributeMap: empty -> nothing (no secret, no ATTRIBUTE_MAP). Otherwise it
  # is a Secrets Manager Arn, an SSM parameter Arn, or inline JSON. Splitting
  # on an Arn prefix yields "" as the first element only when the value starts
  # with it (an empty value also yields "", hence the SetAttributeMap guard).
  SetAttributeMap: !Not
    - !Equals [!Ref AttributeMap, ""]
  AttributeMapIsSecretArn: !And
    - !Condition SetAttributeMap
    - !Equals [!Select [0, !Split ["arn:aws:secretsmanager:", !Ref AttributeMap]], ""]
  AttributeMapIsParameterArn: !And
    - !Condition SetAttributeMap
    - !Equals [!Select [0, !Split ["arn:aws:ssm:", !Ref AttributeMap]], ""]
  AttributeMapIsInline: !And
    - !Condition SetAttributeMap
    - !Not [!Condition AttributeMapIsSecretArn]
    - !Not [!Condition AttributeMapIsParameterArn]
  # Inline JSON is stored as a secret when the pattern creates secrets, like
  # the other secret-backed parameters (and keeps it out of the 4 KB Lambda
  # environment); otherwise it is passed to ATTRIBUTE_MAP as-is.
  CreateAttributeMapSecret: !And
    - !Condition CreateSecrets
    - !Condition AttributeMapIsInline
  ShareAttributeMapSecret: !And
    - !Condition CreateKey
    - !Condition CreateAttributeMapSecret
  # Google authentication (issue #345): exactly one method (see Rules).
  # Keyless is selected by GoogleImpersonateServiceAccount; the key in
  # GoogleCredentials is the default. Values that are already Arns are passed
  # through; literal values are stored as SSOSync* secrets by the patterns
  # that create secrets, like the other secret-backed parameters.
  SetGoogleCredentials: !Not
    - !Equals [!Ref GoogleCredentials, ""]
  CreateGoogleCredentialsSecret: !And
    - !Condition CreateSecrets
    - !Condition SetGoogleCredentials
  ShareGoogleCredentialsSecret: !And
    - !Condition CreateKey
    - !Condition CreateGoogleCredentialsSecret
  GoogleKeyless: !Not
    - !Equals [!Ref GoogleImpersonateServiceAccount, ""]
  GoogleImpersonateIsSecretArn: !And
    - !Condition GoogleKeyless
    - !Equals [!Select [0, !Split ["arn:aws:secretsmanager:", !Ref GoogleImpersonateServiceAccount]], ""]
  CreateGoogleImpersonateSecret: !And
    - !Condition CreateSecrets
    - !Condition GoogleKeyless
    - !Not [!Condition GoogleImpersonateIsSecretArn]
  ShareGoogleImpersonateSecret: !And
    - !Condition CreateKey
    - !Condition CreateGoogleImpersonateSecret
  SetGoogleWIFConfig: !Not
    - !Equals [!Ref GoogleWIFConfig, ""]
  GoogleWIFConfigIsSecretArn: !And
    - !Condition SetGoogleWIFConfig
    - !Equals [!Select [0, !Split ["arn:aws:secretsmanager:", !Ref GoogleWIFConfig]], ""]
  GoogleWIFConfigIsParameterArn: !And
    - !Condition SetGoogleWIFConfig
    - !Equals [!Select [0, !Split ["arn:aws:ssm:", !Ref GoogleWIFConfig]], ""]
  CreateGoogleWIFConfigSecret: !And
    - !Condition CreateSecrets
    - !Condition SetGoogleWIFConfig
    - !Not [!Condition GoogleWIFConfigIsSecretArn]
    - !Not [!Condition GoogleWIFConfigIsParameterArn]
  ShareGoogleWIFConfigSecret: !And
    - !Condition CreateKey
    - !Condition CreateGoogleWIFConfigSecret
  # Google admin (issue #192): optional. Set -> domain-wide delegation on
  # behalf of that admin; empty -> the service account acts as itself.
  SetGoogleAdminEmail: !Not
    - !Equals [!Ref GoogleAdminEmail, ""]
  CreateGoogleAdminEmailSecret: !And
    - !Condition CreateSecrets
    - !Condition SetGoogleAdminEmail
  ShareGoogleAdminEmailSecret: !And
    - !Condition CreateKey
    - !Condition CreateGoogleAdminEmailSecret
  OnSchedule: !And
    - !Condition CreateFunction
    - !Not
      - !Equals [!Ref ScheduleExpression, ""]
  CreateFunction: !Or
    - !Condition RemoteSecrets
    - !Condition LocalSecrets
  CreateSecrets: !Or
    - !Equals [!Ref DeployPattern, "App + secrets"]
    - !Equals [!Ref DeployPattern, "Secrets only"]
    - !Equals [!Ref DeployPattern, "Secrets for cross-account"]
  CreateKey: !Equals [!Ref DeployPattern, "Secrets for cross-account"]
  RemoteSecrets: !Equals [!Ref DeployPattern, "App for cross-account"]
  LocalSecrets: !Or
    - !Equals [!Ref DeployPattern, "App + secrets"]
    - !Equals [!Ref DeployPattern, "App only"]

Rules:
  memberKeyQuery:
    RuleCondition: !Contains [[memberkey, memberKey, MEMBERKEY], !Ref GoogleGroupMatch]
    Assertions:
      - Assert: !Not
        - !Equals [!Ref GoogleCustomerId, "my_customer"]
        AssertDescription: 'If memberKey is used in GroupMatch, the actual CustomerId must also be supplied.'
  # The secret parameters (GoogleCustomerId, GoogleCredentials, GoogleAdminEmail,
  # SCIMEndpointUrl, SCIMEndpointAccessToken) must be secret Arns for this
  # pattern. Rules cannot test a prefix: Fn::Contains is an exact match against
  # the list items, so the former Contains [['arn:aws:secretsmanager:'], ...]
  # assertions rejected every real Arn. Each value's AllowedPattern accepts a
  # secret Arn, and SSOSyncRoleRemote uses the values directly as IAM policy
  # Resources, which IAM rejects unless they are Arns.
  # Google authentication: exactly one method. Keyless (impersonation) is
  # selected by GoogleImpersonateServiceAccount; otherwise the key in
  # GoogleCredentials is required, and a WIF configuration makes no sense.
  GoogleKeylessAuth:
    RuleCondition: !Not
      - !Equals [!Ref GoogleImpersonateServiceAccount, ""]
    Assertions:
      - Assert: !Equals ['', !Ref GoogleCredentials]
        AssertDescription: 'Use one Google authentication method: leave GoogleCredentials empty when GoogleImpersonateServiceAccount (keyless) is set.'
      - Assert: !Equals ['', !Ref GoogleAdminEmail]
        AssertDescription: 'Keyless authentication does not act on behalf of a Google admin: leave GoogleAdminEmail empty and assign a read-only Workspace admin role to the service account.'
      - Assert: !Not
          - !Equals [!Ref GoogleCustomerId, "my_customer"]
        AssertDescription: 'Keyless authentication (GoogleImpersonateServiceAccount) requires the actual GoogleCustomerId (Cxxxxxxxx, or the Arn of a secret containing it), not my_customer.'
  # Without an admin the service account calls the Admin SDK as itself, so
  # the customer must be explicit (matches validateCustomer in the code).
  GoogleNoAdmin:
    RuleCondition: !Equals [!Ref GoogleAdminEmail, ""]
    Assertions:
      - Assert: !Not
          - !Equals [!Ref GoogleCustomerId, "my_customer"]
        AssertDescription: 'When GoogleAdminEmail is empty (the service account acts as itself), the actual GoogleCustomerId (Cxxxxxxxx, or the Arn of a secret containing it) is required, not my_customer.'
  GoogleKeyAuth:
    RuleCondition: !Equals [!Ref GoogleImpersonateServiceAccount, ""]
    Assertions:
      - Assert: !Not
          - !Equals ['', !Ref GoogleCredentials]
        AssertDescription: 'Google authentication is required: provide GoogleCredentials (service-account key) or GoogleImpersonateServiceAccount (keyless).'
      - Assert: !Equals ['', !Ref GoogleWIFConfig]
        AssertDescription: 'GoogleWIFConfig is only used for keyless authentication; also set GoogleImpersonateServiceAccount, or leave it empty.'
  SecretValues:
    RuleCondition: !Equals [!Ref DeployPattern, "App for cross-account"]
    Assertions:
      - Assert: !Not
          - !Equals ['', !Ref AppAccount]
        AssertDescription: 'The AWS account id, of the account where you intend to deploy the app is required for this deployment type.'
      - Assert: !Not
          - !Equals ['', !Ref KMSKey]
        AssertDescription: 'The Arn of the KMS Key used to encrypt the secrets is required for this deployment type.'
  LocalSecrets:
    RuleCondition: !Or
      - !Equals [!Ref DeployPattern, "App + secrets"]
      - !Equals [!Ref DeployPattern, "App only"]
    Assertions:
      - Assert: !Equals ['', !Ref AppAccount]
        AssertDescription: 'Do not provide a AppAccount for this deployment type.'
      - Assert: !Equals ['', !Ref KMSKey]
        AssertDescription: 'Do not provide a KMS Key for this deployment type.'
  # The stack creates its own KMS key and shares the key and secrets with
  # AppAccount (key policy and secret resource policies use ${AppAccount}).
  CrossSecrets:
    RuleCondition: !Equals [!Ref DeployPattern, "Secrets for cross-account"]
    Assertions:
      - Assert: !Not
          - !Equals ['', !Ref AppAccount]
        AssertDescription: 'The AWS account id, of the account where you intend to deploy the app, is required for this deployment type.'
      - Assert: !Equals ['', !Ref KMSKey]
        AssertDescription: 'Do not provide a KMS Key for this deployment type.'

Resources:

  SSOSyncRoleLocal:
    Type: AWS::IAM::Role
    Condition: LocalSecrets
    Properties:
      RoleName: !If [SetRoleName, !Ref RoleName, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
            - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
              - lambda.amazonaws.com
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaExecute
      Policies:
        - PolicyName: SSOSyncAppPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SSMGetParameterPolicy
                Effect: Allow
                Action:
                  - "secretsmanager:Get*"
                  - "secretsmanager:DescribeSecret"
                Resource:
                  - !If [CreateSecrets, !Ref SecretGoogleCustomerId, !Ref GoogleCustomerId]
                  - !If
                    - CreateGoogleCredentialsSecret
                    - !Ref SecretGoogleCredentials
                    - !If [SetGoogleCredentials, !Ref GoogleCredentials, !Ref AWS::NoValue]
                  - !If
                    - CreateGoogleImpersonateSecret
                    - !Ref SecretGoogleImpersonateServiceAccount
                    - !If [GoogleImpersonateIsSecretArn, !Ref GoogleImpersonateServiceAccount, !Ref AWS::NoValue]
                  - !If
                    - CreateGoogleWIFConfigSecret
                    - !Ref SecretGoogleWIFConfig
                    - !If [GoogleWIFConfigIsSecretArn, !Ref GoogleWIFConfig, !Ref AWS::NoValue]
                  - !If
                    - CreateGoogleAdminEmailSecret
                    - !Ref SecretGoogleAdminEmail
                    - !If [SetGoogleAdminEmail, !Ref GoogleAdminEmail, !Ref AWS::NoValue]
                  - !If [CreateSecrets, !Ref SecretSCIMEndpoint, !Ref SCIMEndpointUrl]
                  - !If [CreateSecrets, !Ref SecretSCIMAccessToken, !Ref SCIMEndpointAccessToken]
                  - !If
                    - CreateAttributeMapSecret
                    - !Ref SecretAttributeMap
                    - !If [AttributeMapIsSecretArn, !Ref AttributeMap, !Ref AWS::NoValue]
              - !If
                - GoogleWIFConfigIsParameterArn
                - Sid: GoogleWIFConfigParameterPolicy
                  Effect: Allow
                  Action:
                    - "ssm:GetParameter"
                  Resource:
                    - !Ref GoogleWIFConfig
                - !Ref AWS::NoValue
              - !If
                - AttributeMapIsParameterArn
                - Sid: AttributeMapParameterPolicy
                  Effect: Allow
                  Action:
                    - "ssm:GetParameter"
                  Resource:
                    - !Ref AttributeMap
                - !Ref AWS::NoValue
              - Sid: CrossRegionSecretsPolicy
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource:
                  - !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:SSOSync*"
              - Sid: IdentityStoreAccessPolicy
                Effect: Allow
                Action:
                  - "identitystore:ListGroups"
                  - "identitystore:ListUsers"
                  - "identitystore:ListGroupMemberships"
                  - "identitystore:IsMemberInGroups"
                  - "identitystore:GetGroupMembershipId"
                Resource:
                  - "*"
              - Sid: SsoAdminAccessPolicy
                Effect: Allow
                Action: 
                  - "sso:ListInstances"
                Resource:
                  - "*"
              - Sid: CodePipelinePolicy
                Effect: Allow
                Action:
                  - codepipeline:PutJobSuccessResult
                  - codepipeline:PutJobFailureResult
                Resource: "*"

  SSOSyncRoleRemote:
    Type: AWS::IAM::Role
    Condition: RemoteSecrets
    Properties:
      RoleName: !If [SetRoleName, !Ref RoleName, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
            - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
              - lambda.amazonaws.com
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaExecute
      Policies:
        - PolicyName: SSOSyncAppPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SSMGetParameterPolicy
                Effect: Allow
                Action:
                  - "secretsmanager:Get*"
                  - "secretsmanager:DescribeSecret"
                Resource:
                  - !Ref GoogleCustomerId # GoogleCustomerId
                  - !If [SetGoogleCredentials, !Ref GoogleCredentials, !Ref AWS::NoValue] # GoogleCredentials
                  - !If [GoogleImpersonateIsSecretArn, !Ref GoogleImpersonateServiceAccount, !Ref AWS::NoValue]
                  - !If [GoogleWIFConfigIsSecretArn, !Ref GoogleWIFConfig, !Ref AWS::NoValue]
                  - !If [SetGoogleAdminEmail, !Ref GoogleAdminEmail, !Ref AWS::NoValue] # GoogleAdminEmail
                  - !Ref SCIMEndpointUrl # SCIMEndpointUrl
                  - !Ref SCIMEndpointAccessToken # SCIMEndpointAccessToken
                  - !If [AttributeMapIsSecretArn, !Ref AttributeMap, !Ref AWS::NoValue] # AttributeMap
              - !If
                - GoogleWIFConfigIsParameterArn
                - Sid: GoogleWIFConfigParameterPolicy
                  Effect: Allow
                  Action:
                    - "ssm:GetParameter"
                  Resource:
                    - !Ref GoogleWIFConfig
                - !Ref AWS::NoValue
              - !If
                - AttributeMapIsParameterArn
                - Sid: AttributeMapParameterPolicy
                  Effect: Allow
                  Action:
                    - "ssm:GetParameter"
                  Resource:
                    - !Ref AttributeMap
                - !Ref AWS::NoValue
              - Sid: CrossRegionSecretsPolicy
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource:
                  - !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:SSOSync*"
              - Sid: KMSDecryptPolicy
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  -  !Ref KMSKey
              - Sid: IdentityStoreAccesPolicy
                Effect: Allow
                Action:
                  - "identitystore:ListGroups"
                  - "identitystore:ListUsers"
                  - "identitystore:ListGroupMemberships"
                  - "identitystore:IsMemberInGroups"
                  - "identitystore:GetGroupMembershipId"
                Resource:
                  - "*"
              - Sid: SsoAdminAccessPolicy
                Effect: Allow
                Action: 
                  - "sso:ListInstances"
                Resource:
                  - "*"
              - Sid: CodePipelinePolicy
                Effect: Allow
                Action:
                  - codepipeline:PutJobSuccessResult
                  - codepipeline:PutJobFailureResult
                Resource: "*"

  SSOSyncFunction:
    Type: AWS::Serverless::Function
    Condition: CreateFunction
    Properties:
      FunctionName: !If [SetFunctionName, !Ref FunctionName, !Ref AWS::NoValue]
      Description: "An instance of ssosync deplyed from the Serverless Application Repository, for details see http://https://github.com/awslabs/ssosync"
      Role: !If [RemoteSecrets, !GetAtt SSOSyncRoleRemote.Arn, !GetAtt SSOSyncRoleLocal.Arn]
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeOut
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          LOG_FORMAT: !Ref LogFormat
          CUSTOMER_ID: !If [CreateSecrets, !Ref SecretGoogleCustomerId, !Ref GoogleCustomerId]
          GOOGLE_CREDENTIALS: !If
            - CreateGoogleCredentialsSecret
            - !Ref SecretGoogleCredentials
            - !If [SetGoogleCredentials, !Ref GoogleCredentials, !Ref AWS::NoValue]
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: !If
            - CreateGoogleImpersonateSecret
            - !Ref SecretGoogleImpersonateServiceAccount
            - !If [GoogleKeyless, !Ref GoogleImpersonateServiceAccount, !Ref AWS::NoValue]
          GOOGLE_WIF_CONFIG: !If
            - CreateGoogleWIFConfigSecret
            - !Ref SecretGoogleWIFConfig
            - !If [SetGoogleWIFConfig, !Ref GoogleWIFConfig, !Ref AWS::NoValue]
          GOOGLE_ADMIN: !If
            - CreateGoogleAdminEmailSecret
            - !Ref SecretGoogleAdminEmail
            - !If [SetGoogleAdminEmail, !Ref GoogleAdminEmail, !Ref AWS::NoValue]
          SCIM_ENDPOINT: !If [CreateSecrets, !Ref SecretSCIMEndpoint, !Ref SCIMEndpointUrl]
          SCIM_ACCESS_TOKEN: !If [CreateSecrets, !Ref SecretSCIMAccessToken, !Ref SCIMEndpointAccessToken]
          USER_MATCH: !If [SetGoogleUserMatch, !Ref GoogleUserMatch, !Ref AWS::NoValue]
          GROUP_MATCH: !If [SetGoogleGroupMatch, !Ref GoogleGroupMatch, !Ref AWS::NoValue]
          SYNC_METHOD: !If [LegacySync, !Ref SyncMethod, !Ref AWS::NoValue]
          IGNORE_GROUPS: !If [SetIgnoreGroups, !Ref IgnoreGroups, !Ref AWS::NoValue]
          IGNORE_USERS: !If [SetIgnoreUsers, !Ref IgnoreUsers, !Ref AWS::NoValue]
          INCLUDE_GROUPS: !If [SetIncludeGroups, !Ref IncludeGroups, !Ref AWS::NoValue]
          DRY_RUN: !If [SetDryRun, 'True', !Ref AWS::NoValue]
          SYNC_SUSPENDED: !If [SetSyncSuspended, 'True', !Ref AWS::NoValue]
          PRECACHE_ORG_UNITS: !If [DisablePrecaching, !Ref AWS::NoValue, !Ref PrecacheOrgUnits]
          FORCE_EXTERNAL_ID_UPDATE: !If [SetForceExternalIdUpdate, 'True', !Ref AWS::NoValue]
          RETAIN_UNMATCHED: !If [SetRetainUnmatched, 'True', !Ref AWS::NoValue]
          ATTRIBUTE_MAP: !If
            - CreateAttributeMapSecret
            - !Ref SecretAttributeMap
            - !If [SetAttributeMap, !Ref AttributeMap, !Ref AWS::NoValue]

  PermissionForEventsToInvokeLambda:
    Type: AWS::Lambda::Permission
    Condition: OnSchedule
    Properties:
      FunctionName: !Ref SSOSyncFunction
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt SyncScheduledEvent.Arn

  SyncScheduledEvent:
    Type: AWS::Events::Rule
    Condition: OnSchedule
    Properties:
      Name: AWSSyncSchedule
      ScheduleExpression: !Ref ScheduleExpression
      Targets:
        - Id: SSOSync
          Arn: !GetAtt SSOSyncFunction.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Condition: SetLogRetention
    Properties:
      LogGroupName: !Sub /aws/lambda/${SSOSyncFunction}
      RetentionInDays: !Ref LogRetention

  KeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKey
    Properties:
      AliasName: alias/SSOSync
      TargetKeyId: !Ref KeyForSecrets
  KeyForSecrets:
    Type: AWS::KMS::Key
    Condition: CreateKey
    Properties:
      Description: Key for protecting SSOSync Secrets in cross-account deployment
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
          Action: 'kms:*'
          Resource: '*'
        - Sid: AppRole in Other account
          Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - kms:Decrypt
            - kms:DescribeKey
          Resource: '*'

  SecretGoogleCustomerId:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateSecrets
    Properties:
      Name: SSOSyncGoogleCustomerId
      SecretString: !Ref GoogleCustomerId
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretGoogleCustomerIdPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: CreateKey
    Properties:
      SecretId: !Ref SecretGoogleCustomerId
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  SecretGoogleCredentials:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateGoogleCredentialsSecret
    Properties:
      Name: SSOSyncGoogleCredentials
      SecretString: !Ref GoogleCredentials
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretGoogleCredentialsPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: ShareGoogleCredentialsSecret
    Properties:
      SecretId: !Ref SecretGoogleCredentials
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  # Keyless Google authentication (issue #345).
  SecretGoogleImpersonateServiceAccount:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateGoogleImpersonateSecret
    Properties:
      Name: SSOSyncGoogleImpersonateServiceAccount
      SecretString: !Ref GoogleImpersonateServiceAccount
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretGoogleImpersonateServiceAccountPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: ShareGoogleImpersonateSecret
    Properties:
      SecretId: !Ref SecretGoogleImpersonateServiceAccount
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  SecretGoogleWIFConfig:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateGoogleWIFConfigSecret
    Properties:
      Name: SSOSyncGoogleWIFConfig
      SecretString: !Ref GoogleWIFConfig
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretGoogleWIFConfigPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: ShareGoogleWIFConfigSecret
    Properties:
      SecretId: !Ref SecretGoogleWIFConfig
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  SecretGoogleAdminEmail:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateGoogleAdminEmailSecret
    Properties:
      Name: SSOSyncGoogleAdminEmail
      SecretString: !Ref GoogleAdminEmail
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretGoogleAdminEmailPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: ShareGoogleAdminEmailSecret
    Properties:
      SecretId: !Ref SecretGoogleAdminEmail
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  SecretSCIMEndpoint: # This can be moved to custom provider
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateSecrets
    Properties:
      Name: SSOSyncSCIMEndpointUrl
      SecretString: !Ref SCIMEndpointUrl
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretSCIMEndpointPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: CreateKey
    Properties:
      SecretId: !Ref SecretSCIMEndpoint
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'
        
  SecretSCIMAccessToken: # This can be moved to custom provider
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateSecrets
    Properties:
      Name: SSOSyncSCIMAccessToken
      SecretString: !Ref SCIMEndpointAccessToken
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretSCIMAccessTokenPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: CreateKey
    Properties:
      SecretId: !Ref SecretSCIMAccessToken
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'

  SecretAttributeMap:
    Type: "AWS::SecretsManager::Secret"
    Condition: CreateAttributeMapSecret
    Properties:
      Name: SSOSyncAttributeMap
      SecretString: !Ref AttributeMap
      KmsKeyId: !If [CreateKey, !Ref KeyAlias, alias/aws/secretsmanager]
  SecretAttributeMapPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: ShareAttributeMapSecret
    Properties:
      SecretId: !Ref SecretAttributeMap
      ResourcePolicy:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AppAccount}:root
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'
        
Outputs:
  FunctionArn:
    Condition: CreateFunction
    Description: "The Arn of the deployed lambda function"
    Value: !GetAtt SSOSyncFunction.Arn
    Export:
      Name: FunctionARN
  RoleName:
    Condition: CreateFunction
    Description: "The name of the IAM role the function runs as (the RoleName parameter, or the name CloudFormation generated); use it to set up keyless Google authentication (Workload Identity Federation)"
    Value: !If [RemoteSecrets, !Ref SSOSyncRoleRemote, !Ref SSOSyncRoleLocal]
    Export:
      Name: RoleName
  GoogleCustomerId:
    Condition: CreateSecrets
    Description: "The Arn of the secret containing the GoogleCustomerId"
    Value: !Ref SecretGoogleCustomerId
    Export:
      Name: GoogleCustomerId
  GoogleCredentials:
    Condition: CreateGoogleCredentialsSecret
    Description: "The Arn of the secret containing the GoogleCredentials"
    Value: !Ref SecretGoogleCredentials
    Export:
      Name: GoogleCredentials
  GoogleImpersonateServiceAccount:
    Condition: CreateGoogleImpersonateSecret
    Description: "The Arn of the secret containing the GoogleImpersonateServiceAccount"
    Value: !Ref SecretGoogleImpersonateServiceAccount
    Export:
      Name: GoogleImpersonateServiceAccount
  GoogleWIFConfig:
    Condition: CreateGoogleWIFConfigSecret
    Description: "The Arn of the secret containing the GoogleWIFConfig"
    Value: !Ref SecretGoogleWIFConfig
    Export:
      Name: GoogleWIFConfig
  GoogleAdminEmail:
    Condition: CreateGoogleAdminEmailSecret
    Description: "The Arn of the secret containing the GoogleAdminEmail"
    Value: !Ref SecretGoogleAdminEmail
    Export:
      Name: GoogleAdminEmail
  SCIMEndpointUrl:
    Condition: CreateSecrets
    Description: "The Arn of the secret containing the SCIMEndpointUrl"
    Value: !Ref SecretSCIMEndpoint
    Export:
      Name: SCIMEndpointUrl
  SCIMEndpointAccessToken:
    Condition: CreateSecrets
    Description: "The Arn of the secret containing the SCIMEndpointAccessToken"
    Value: !Ref SecretSCIMAccessToken
    Export:
      Name: SCIMEndpointAccessToken
  AttributeMap:
    Condition: CreateAttributeMapSecret
    Description: "The Arn of the secret containing the AttributeMap"
    Value: !Ref SecretAttributeMap
    Export:
      Name: AttributeMap
  KeyAlias:
    Condition: CreateKey
    Description: "The Arn of the KMS key used to encrypt the secrets"
    Value: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${KeyForSecrets}
    Export:
      Name: KeyAlias