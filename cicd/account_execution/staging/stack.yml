AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: 
  This CloudFormation template will deploy an instance of the SSOSync-Staging
  candidate releases (via privately shared app in the AWS Serverless Application
  Repository (SAR) within the Staging Account.

Parameters:
  AppArn:
    Description: The candidate release in the SAR
    Default: 'arn:aws:serverlessrepo:<AWS::Region>:<AccountId>:applications/<ApplicationName>'
    Type: String
  AppVersion:
    Description: The version of this build in SAR
    Default: 'v1.0.0-rc.10'
    Type: String
  # Google authentication. Legacy auth (stored credentials): GoogleCredentialsArn
  # and GoogleAdminEmailArn. Workload Identity Federation (keyless):
  # GoogleImpersonateServiceAccountArn, GoogleWIFConfig and GoogleCustomerIdArn,
  # with no admin. The *Arn parameters are the Arn of a secret whose value is
  # passed to the app; leave one empty to leave the app parameter unset.
  GoogleAdminEmailArn:
    Type: String
    Default: ''
  GoogleCredentialsArn:
    Type: String
    Default: ''
  GoogleImpersonateServiceAccountArn:
    Type: String
    Default: ''
  GoogleWIFConfig:
    Description: >-
      Inline Workload Identity Federation credential configuration for this
      account's RoleName provider (no secret values), from the staging
      buildspec's deploy/wif-<AccountId>.json; the app stores it as a secret.
    Type: String
    Default: ''
  GoogleCustomerIdArn:
    Description: Empty -> the app default (my_customer)
    Type: String
    Default: ''
  RoleName:
    Description: The name of the function's IAM role; empty -> generated by CloudFormation. Required with GoogleWIFConfig (the role its provider trusts).
    Type: String
    Default: ''
  SCIMEndpointUrlArn:
    Type: String
  SCIMAccessTokenArn:
    Type: String
  RegionArn:
    Type: String
  GroupMatch:
    Description: The search string to match Groups in Google Workspace
    Default: 'name:AWS*'
    Type: String
  AttributeMap:
    Description: >-
      Inline attribute-map JSON passed to the function's ATTRIBUTE_MAP environment
      variable. Leave empty to use the built-in default mapping.
    Default: ''
    Type: String

Conditions:
  SetGoogleAdminEmail: !Not [!Equals [!Ref GoogleAdminEmailArn, '']]
  SetGoogleCredentials: !Not [!Equals [!Ref GoogleCredentialsArn, '']]
  SetGoogleImpersonateServiceAccount: !Not [!Equals [!Ref GoogleImpersonateServiceAccountArn, '']]
  SetGoogleCustomerId: !Not [!Equals [!Ref GoogleCustomerIdArn, '']]

Resources:
  SARApp:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: !Ref AppArn
        SemanticVersion: !Ref AppVersion
      Parameters:
        FunctionName: SSOSyncFunction
        RoleName: !Ref RoleName
        GoogleAdminEmail: !If
          - SetGoogleAdminEmail
          - !Join ['', ['{{resolve:secretsmanager:', !Ref GoogleAdminEmailArn, '}}']]
          - ''
        GoogleCredentials: !If
          - SetGoogleCredentials
          - !Join ['', ['{{resolve:secretsmanager:', !Ref GoogleCredentialsArn, '}}']]
          - ''
        GoogleImpersonateServiceAccount: !If
          - SetGoogleImpersonateServiceAccount
          - !Join ['', ['{{resolve:secretsmanager:', !Ref GoogleImpersonateServiceAccountArn, '}}']]
          - ''
        GoogleWIFConfig: !Ref GoogleWIFConfig
        GoogleCustomerId: !If
          - SetGoogleCustomerId
          - !Join ['', ['{{resolve:secretsmanager:', !Ref GoogleCustomerIdArn, '}}']]
          - my_customer
        SCIMEndpointUrl: !Join
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref SCIMEndpointUrlArn
            - '}}'
        SCIMEndpointAccessToken: !Join
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref SCIMAccessTokenArn
            - '}}'
        Region: !Join
          - ''
          - - '{{resolve:secretsmanager:'
            - !Ref RegionArn
            - '}}'
        SyncMethod: groups
        GoogleGroupMatch: !Ref GroupMatch
        AttributeMap: !Ref AttributeMap
        SyncSuspended: sync
        ScheduleExpression: ""
        PrecacheOrgUnits: '/Catering/,/Maintenance/Vending Machines'
        LogLevel: debug
        LogFormat: json
