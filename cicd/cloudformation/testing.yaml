AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: 
  This CloudFormation template will deploy a full CI/CD pipeline for testing SSO
  Sync, within a staging account, triggered from a build pipeline in a production
  account.

Parameters:
  ProductionAccount:
    Description: AWS Account where the build pipeline in deployed
    Default: "004480582608"
    Type: String
    AllowedPattern: '[0-9]+'
  TestAccount:
    Description: The test account type
    Default: "Management"
    Type: String
    AllowedValues:
      - Management
      - Delegated
      - NonDelegated
  DelegatedAccount:
    Description: The account id of the account setup as delegated admin
    Default: "622987834645"
    Type: String
  DelegatedBucket:
    Description: The S3 bucket arn from the testing stack in the the delegated account
    Type: String


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Production Account
        Parameters:
          - ProductionAccount
      - Label:
          default: Testing Account
        Parameters:
          - TestAccount
      - Label:
          default: Delegated Account
          description: Only required for when deploying in the management account
        Parameters:
          - DelegatedAccount
          - DelegatedBucket
            
    ParameterLabels:
      ProductionAccount:
        default: "ProductionAccount"
      TestAccount:
        default: "Account Type"
      DelegatedAccount:
        default: "Only required for Management Account"
      DelegatedBucket:
        default: "bucket in the Delegated Account"

Conditions:
  DeployManagement: !Equals [ !Ref TestAccount, Management]
  DeployDelegated: !Equals [ !Ref TestAccount, Delegated]
  DeployNonDelegated: !Equals [ !Ref TestAccount, NonDelegated]

Resources:

  CodePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    Properties: 
      LogGroupName: SSOSync-Test
      RetentionInDays: 120

  ArtifactBucketKey:
    Type: AWS::KMS::Key
    Properties: 
      Description: Key for this CodePipeline
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
          Action: 'kms:*'
          Resource: '*'

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt ArtifactBucketKey.Arn 
            BucketKeyEnabled: true

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyUnEncryptedObjectUploads
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            StringNotEquals: 
              s3:x-amz-server-side-encryption: aws:kms
        - Sid: RequireKMSEncryption
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition:
            StringNotLikeIfExists:
              s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ArtifactBucketKey.Arn
        - Sid: DenyInsecureConnections
          Effect: Deny
          Principal: "*"
          Action: "s3:*"
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            Bool: 
              aws:SecureTransport: false

  StagingBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete
    Properties:
      VersioningConfiguration:
        Status: Enabled

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['s3:GetObject']
          Effect: Allow
          Principal:
            Service: 'codepipeline.amazonaws.com'
          Resource:
          - !Sub ${StagingBucket.Arn}/*
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId

  CodePipelineTestAccountExecution:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: SSOSync-Test-Account_Execution
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: tests.zip
                PollForSourceChanges: false
        - Name: TestsLambda
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/lambda.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: Lambda
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildSmokeLambda
                PrimarySource: Tests
              OutputArtifacts:
                - Name: AccountExecutionLambda
              InputArtifacts:
                - Name: Tests
        - Name: TestsCLI
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/cli.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: CLI
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildSmokeCLI
                PrimarySource: Tests
              OutputArtifacts:
                - Name: SmokeCLI
              InputArtifacts:
                - Name: Tests
        # Attribute-map integration tests (tests/attribute_map/), delegated
        # administrator account only. Each live test resets the (dedicated test)
        # Identity Store to tests/attribute_map/baseline/, deleting every user
        # and group in it, so every action runs in sequence (distinct RunOrder).
        - !If
            - DeployDelegated
            - Name: AttributeMapTests
              Actions:
                - Name: InvalidMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 1
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapInvalidMap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapInvalidMap
                - Name: DefaultMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 2
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapDefaultMap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapDefaultMap
                - Name: Determinism
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 3
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapDeterminism
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapDeterminism
                - Name: RichMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 4
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapRichMap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapRichMap
                - Name: ValidationWarnings
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 5
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapValidationWarnings
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapValidationWarnings
                - Name: UsernameRemap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 6
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapUsernameRemap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapUsernameRemap
                - Name: ManagerOptIn
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 7
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapManagerOptIn
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapManagerOptIn
                # TestsCLI left the stack on cli.json (GroupMatch name:Man*);
                # redeploy with the developer params (name:AWS*, the baseline
                # groups) and the built-in default map (AttributeMap unset).
                - Name: DeployDefaultAttributeMap
                  ActionTypeId:
                    Category: Deploy
                    Owner: AWS
                    Version: '1'
                    Provider: CloudFormation
                  Configuration:
                    ActionMode: CREATE_UPDATE
                    Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                    StackName: TestAccountExecution
                    RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                    TemplateConfiguration: 'Tests::deploy/developer.json'
                    TemplatePath: 'Tests::deploy/stack.yml'
                  InputArtifacts:
                    - Name: Tests
                  RunOrder: 8
                - Name: LambdaDefaultMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 9
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapLambdaDefault
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapLambdaDefault
                # Redeploy the function with maps/rich.json inline in ATTRIBUTE_MAP.
                - Name: DeployInlineAttributeMap
                  ActionTypeId:
                    Category: Deploy
                    Owner: AWS
                    Version: '1'
                    Provider: CloudFormation
                  Configuration:
                    ActionMode: CREATE_UPDATE
                    Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                    StackName: TestAccountExecution
                    RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                    TemplateConfiguration: 'Tests::deploy/attributemap.json'
                    TemplatePath: 'Tests::deploy/stack.yml'
                  InputArtifacts:
                    - Name: Tests
                  RunOrder: 10
                - Name: LambdaInlineMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 11
                  Configuration:
                    ProjectName: !Ref CodeBuildAttrMapLambdaInlineMap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                  OutputArtifacts:
                    - Name: AttrMapLambdaInlineMap
            - !Ref AWS::NoValue
        # Functional tests against the live tenant.
        - Name: FunctionalTests
          Actions:
            # Live proof of getUserOperations/getGroupOperations (issue #383) in
            # this account type (Management, Delegated or NonDelegated): the
            # expected IssuerArn is built from the instance owner account and
            # matches the real ExternalId Issuer wherever ssosync runs.
            # See tests/user_group_operations/run.sh.
            - Name: UserGroupOperations
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 1
              Configuration:
                ProjectName: !Ref CodeBuildUserGroupOperations
                PrimarySource: Tests
              OutputArtifacts:
                - Name: UserGroupOperations
              InputArtifacts:
                - Name: Tests
        - !If
            - DeployDelegated
            - Name: TestsCodePipeline
              Actions:
                - Name: Deploy
                  ActionTypeId:
                    Category: Deploy
                    Owner: AWS
                    Version: '1'
                    Provider: CloudFormation
                  Configuration:
                    ActionMode: CREATE_UPDATE
                    Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                    StackName: TestAccountExecution
                    RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                    TemplateConfiguration: 'Tests::deploy/codepipeline.json'
                    TemplatePath: !Sub 'Tests::deploy/stack.yml'
                  InputArtifacts:
                    - Name: Tests
                  RunOrder: 1
                - Name: CodePipeline
                  ActionTypeId:
                    Category: Invoke
                    Owner: AWS
                    Version: 1
                    Provider: Lambda
                  RunOrder: 2
                  Configuration:
                    FunctionName: SSOSyncFunction
                  OutputArtifacts:
                    - Name: AccountExecutionCodePipeline
                  InputArtifacts:
                    - Name: Tests
            - !Ref AWS::NoValue
        - Name: CleanUp
          Actions:
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
        # Quick-start templates (quick-start/*.yaml) against the build under
        # test, delegated admin account only. Each action deploys its template
        # (rewritten to the staging SAR app and version), invokes the function
        # and deletes the stack again; see tests/quick_start/run.sh. They run
        # after CleanUp and one at a time, because every quick-start creates the
        # same SSOSync* secrets and SSOSync function as TestAccountExecution.
        - !If
            - DeployDelegated
            - Name: QuickStartTests
              Actions:
                - Name: SingleAccount
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 1
                  Configuration:
                    ProjectName: !Ref CodeBuildQuickStartSingleAccount
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
                - Name: SingleAccountAttributeMap
                  ActionTypeId:
                    Category: Test
                    Owner: AWS
                    Version: 1
                    Provider: CodeBuild
                  RunOrder: 2
                  Configuration:
                    ProjectName: !Ref CodeBuildQuickStartSingleAccountAttributeMap
                    PrimarySource: Tests
                  InputArtifacts:
                    - Name: Tests
            - !Ref AWS::NoValue

  CodePipelineDeployCrossAccountSecrets:
    Type: AWS::CodePipeline::Pipeline
    Condition: DeployManagement
    Properties:
      Name: SSOSync-Deploy_CrossAccount_Secrets
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: crossaccount_secrets.zip
                PollForSourceChanges: false
        - Name: Deploy
          Actions:
            - Name: DeploySecrets
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestCrossAccountSecrets
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/crossaccountsecrets.json'
                TemplatePath: !Sub 'Tests::deploy/crossaccountsecrets.yml'
                OutputFileName: crossaccountapp.json
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: Secrets
              RunOrder: 1
            - Name: DeployAppInDelegated
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildTestingAppStack
                PrimarySource: Tests
              InputArtifacts:
                - Name: Tests
                - Name: Secrets
        - Name: CleanUp
          Actions:
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestCrossAccountSecrets
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 1

  CodePipelineCrossAccountApp:
    Type: AWS::CodePipeline::Pipeline
    Condition: DeployDelegated
    Properties:
      Name: SSOSync-CrossAccountApp
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: crossaccount_app.zip
                PollForSourceChanges: false
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestCrossAccountApp
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/crossaccountapp.json'
                TemplatePath: !Sub 'Tests::deploy/crossaccountapp.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
        - Name: Execute
          Actions:
            - Name: Run-Test
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 3
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: ExecuteCrossAccountApp
              InputArtifacts:
                - Name: Tests
        - Name: CleanUp
          Actions:
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestCrossAccountApp
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 1

  CodePipelineSingleStack:
    Type: AWS::CodePipeline::Pipeline
    Condition: DeployDelegated
    Properties:
      Name: SSOSync-SingleStack
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: singlestack.zip
                PollForSourceChanges: false
        - Name: NamedFunction
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestSingleStack
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/singlestack.json'
                TemplatePath: !Sub 'Tests::deploy/namedfunction.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: Run-Test
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 2
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: ExecuteSingleStack
              InputArtifacts:
                - Name: Tests
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestSingleStack
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 3
        - Name: UnNamedFunction
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestSingleStack
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/singlestack.json'
                TemplatePath: !Sub 'Tests::deploy/unnamedfunction.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestSingleStack
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 2

  CodePipelineSplitStack:
    Type: AWS::CodePipeline::Pipeline
    Condition: DeployDelegated
    Properties:
      Name: SSOSync-SplitStack
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: splitstack.zip
                PollForSourceChanges: false
        - Name: Deploy
          Actions:
            - Name: DeploySecrets
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestSecretsOnly
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/secretsonly.json'
                TemplatePath: !Sub 'Tests::deploy/secretsonly.yml'
                OutputFileName: apponly.json
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: Secrets
              RunOrder: 1
            - Name: DeployApp
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAppOnly
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/apponly.json'
                TemplatePath: !Sub 'Tests::deploy/apponly.yml'
              InputArtifacts:
                - Name: Tests
                - Name: Secrets
              RunOrder: 2
        - Name: Execute
          Actions:
            - Name: CodePipeline
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 3
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: SmokeCodePipeline
              InputArtifacts:
                - Name: Tests
        - Name: CleanUp
          Actions:
            - Name: RemoveSecrets
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestSecretsOnly
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: RemoveApp
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAppOnly
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 2

  CodeBuildSmokeCLI:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: SSOSync-Smoke-CLI
      Description: "Execute within a container on the cli to prove cli invokation"
      ServiceRole: !Ref CodeBuildTestRole
      Source:
        Type: CODEPIPELINE
        BuildSpec: "tests/account_execution/cli/buildspec.yml"
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ExpectedExitState
            Value: 0
      Artifacts:
        Name: SSOSync
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref CodePipelineLogGroup
          StreamName: !Ref CodeBuildSmokeCLILogs
          Status: ENABLED

  CodeBuildSmokeCLILogs:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref CodePipelineLogGroup
