version: 0.2
phases:
  install:
    commands:
      # Print all environment variables (handy for AWS CodeBuild logs)
      - env
      - ls -la
      # Update sam to latest version
      - wget -q https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
      - unzip -q aws-sam-cli-linux-x86_64.zip -d sam-installation
      - sudo ./sam-installation/install --update
      - rm -rf ./sam-installation  aws-sam-cli-linux-x86_64.zip
  pre_build:
    commands:
      # Copy in the package files: the legacy application (SSOSync) and the
      # next-gen application (ssosync), see cicd/build/package/buildspec.yml.
      - cp ${CODEBUILD_SRC_DIR_Packaged}/packaged-release.yaml ./packaged.yaml
      - cp ${CODEBUILD_SRC_DIR_Packaged}/packaged-ng-release.yaml ./packaged-ng.yaml
      # Check we have the required files
      - ls packaged.yaml packaged-ng.yaml
      - export AppVersion="${GitTag#v}"
      - echo ${AppVersion}
  build:
    commands:
      # Publish both applications at the release version (sam publish creates
      # the next-gen application the first time).
      - sam publish --template packaged.yaml --semantic-version ${AppVersion}
      - sam publish --template packaged-ng.yaml --semantic-version ${AppVersion}
