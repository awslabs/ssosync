# .github/workflows/release.yaml
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache development tools
        uses: actions/cache@v6
        with:
          path: .bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Run CI pipeline
        run: make test-coverage
        
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Unshallow
        run: git fetch --prune --unshallow
        
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'


      - name: Cache development tools
        uses: actions/cache@v6
        with:
          path: .bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tools-
          
      - name: Create release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sar:
    runs-on: ubuntu-latest
    needs: [ release ]
    steps:
      - name: configure AWS creds
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::004480582608:role/SSOSync-GitHubActions
      - name: Start CodePipeline
        uses: moia-oss/aws-codepipeline-trigger@v2.1.0
        with:
          pipeline: SSOSync-Build
          wait: true # optional (default: false)
          follow-codebuild: false # optional (default: false)