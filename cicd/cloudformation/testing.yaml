          Status: ENABLED

  CodeBuildTestingLogs:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref CodePipelineLogGroup
      LogStreamName: SSOSync-Testing

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-CodePipeline-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal: 
            Service: [codepipeline.amazonaws.com] 
      Path: /
      Policies: 
        - PolicyName: !Sub SSOSync-CodePipeline-${AWS::Region}
          PolicyDocument:                     
            Version: '2012-10-17'
            Statement: 
            - Action:
              - 'iam:PassRole'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'codebuild:BatchGetBuilds'
              - 'codebuild:StartBuild'
              Resource:
              - !Sub ${CodeBuildSmokeCLI.Arn}
              - !Sub ${CodeBuildSmokeLambda.Arn}
              - !Sub ${CodeBuildUserGroupOperations.Arn}
              # Attribute-map test projects exist in the delegated account only.
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapInvalidMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapDefaultMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapDeterminism.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapRichMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapValidationWarnings.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapUsernameRemap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapManagerOptIn.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapLambdaDefault.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapLambdaInlineMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildQuickStartSingleAccount.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildQuickStartSingleAccountAttributeMap.Arn, !Ref AWS::NoValue]
              Effect: Allow
            - Action:
              - 's3:GetBucketPolicy'
              - 's3:GetBucketVersioning'
              Resource:
              - !Sub ${ArtifactBucket.Arn}
              - !Sub ${StagingBucket.Arn}
              Effect: Allow
            - Action:
              - 's3:*'
              Resource:
              - !Sub ${ArtifactBucket.Arn}/*
              - !Sub ${StagingBucket.Arn}/*
              Effect: Allow
            - Action:
              - 'kms:DescribeKey'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:Decrypt'
              Effect: Allow
              Resource:
              - !GetAtt ArtifactBucketKey.Arn
            - Action:
              - 'lambda:InvokeFunction'
              Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SSOSyncFunction
              Effect: Allow
            - Action:
              - 'cloudformation:CreateStack'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DeleteStack'
              - 'cloudformation:UpdateStack'
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:SetStackPolicy'
              Resource:
              - '*'
              Effect: Allow

  ProdAccountRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-ProdAccount-${AWS::Region}
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal: 
            AWS: !Ref ProductionAccount
        Version: '2012-10-17'
      Path: /
      Policies: 
        - PolicyName: !Sub SSOSync-ProdAccount-${AWS::Region}
          PolicyDocument:                     
            Version: '2012-10-17'
            Statement: 
            - Action:
              - 'codepipeline:*'
              Effect: Allow
              Resource:
              - '*'
            - Action:
              - 's3:GetBucketPolicy'
              - 's3:GetBucketVersioning'
              Resource:
              - !Sub ${StagingBucket.Arn}
              Effect: Allow
            - Action:
              - 's3:*'
              Resource:
              - !Sub ${StagingBucket.Arn}/*
              Effect: Allow

  CodeBuildTestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SSOSync-CodeBuild-Test-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [codebuild.amazonaws.com]
      Path: /
      Policies:
        - PolicyName: !Sub SSOSync-CodeBuild-Test-${AWS::Region}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'kms:DescribeKey'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:Decrypt'
              Effect: Allow
              Resource:
              - !GetAtt ArtifactBucketKey.Arn
            - Action: 's3:*'
              Effect: Allow
              Resource:
              - !Sub ${ArtifactBucket.Arn}/*
            - Action:
              -  'lambda:invokeFunction'
              Effect: Allow
              Resource: '*'
            - Action:
                - "identitystore:ListGroups"
                - "identitystore:ListUsers"
                - "identitystore:ListGroupMemberships"
                - "identitystore:IsMemberInGroups"
                - "identitystore:GetGroupMembershipId"
              Effect: Allow
              Resource: '*'
            # tests/user_group_operations: set up local, foreign and missing
            # records to exercise every user/group operation (issue #383).
            - Action:
                - "identitystore:CreateUser"
                - "identitystore:CreateGroup"
                - "identitystore:UpdateUser"
                - "identitystore:UpdateGroup"
                - "identitystore:DeleteUser"
                - "identitystore:DeleteGroup"
              Effect: Allow
              Resource: '*'
            # tests/attribute_map (delegated account only): import.py resets the
            # dedicated test Identity Store to the baseline (memberships
            # included), and the ssosync CLI describes records when reading back
            # attributes.
            - !If
              - DeployDelegated
              - Action:
                  - "identitystore:CreateGroupMembership"
                  - "identitystore:DeleteGroupMembership"
                  - "identitystore:DescribeUser"
                  - "identitystore:DescribeGroup"
                Effect: Allow
                Resource: '*'
              - !Ref AWS::NoValue
            # Attribute-map Lambda tests read the function's log lines for assertions.
            - !If
              - DeployDelegated
              - Action:
                  - "logs:FilterLogEvents"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/SSOSyncFunction:*
              - !Ref AWS::NoValue
            # tests/quick_start (delegated account only): create and delete the
            # QuickStart-* stacks through CloudFormationDeployerRole, read the
            # staging SAR app the rewritten templates point at, read the release
            # account's Pipeline* secret values (cross-account, KMS-encrypted),
            # check that no SSOSync* secret already exists, and inspect the
            # SSOSync function the quick-start creates.
            - !If
              - DeployDelegated
              - Action:
                  - "cloudformation:CreateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:CreateChangeSet"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/QuickStart-*/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Action:
                  - "iam:PassRole"
                Effect: Allow
                Resource:
                  - !GetAtt CloudFormationDeployerRole.Arn
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Action:
                  - "serverlessrepo:CreateCloudFormationTemplate"
                  - "serverlessrepo:GetCloudFormationTemplate"
                  - "serverlessrepo:GetApplication"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:serverlessrepo:${AWS::Region}:${ProductionAccount}:applications/SSOSync-Staging
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Action:
                  - "kms:Decrypt"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:kms:${AWS::Region}:${ProductionAccount}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Action:
                  - "secretsmanager:DescribeSecret"
                  - "lambda:GetFunctionConfiguration"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:SSOSync*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SSOSync
              - !Ref AWS::NoValue
            - Sid: SsoAdminAccessPolicy
              Effect: Allow
              Action: 
                - "sso:ListInstances"
              Resource:
                - "*"
            - Action:
                - "secretsmanager:Get*"
              Resource:
                - "*"
              Effect: Allow

  CloudFormationDeployerRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-CloudFormationDeployerRole-${AWS::Region}
      AssumeRolePolicyDocument: 
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:  
            Service: [cloudformation.amazonaws.com] 
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            AWS: !Ref AWS::AccountId
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [codepipeline.amazonaws.com]
        Version: '2012-10-17'
      Path: /
