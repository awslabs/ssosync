version: 0.2
# Package the two SAR applications from template.yaml (issue #399), each with a
# staging and a release variant. template.yaml holds every feature; a feature
# patch selects what an application exposes and sets its release name, then a
# staging patch sets its staging name:
#
#   legacy   (SSOSync): legacy.patch, the 2.10.0 parameters, patterns widened
#            to accept apostrophes (#401) (key + admin
#            authentication, both sync methods), Name ssosync -> SSOSync;
#            README SAR.md
#            release: legacy.patch only -> SSOSync
#            staging: then legacy-staging.patch -> SSOSync-Staging
#   next-gen (ssosync): next-gen.patch, keyless (Workload Identity Federation)
#            only, groups sync only, required customer id; keeps
#            template.yaml's name; README SAR-next-gen.md
#            release: next-gen.patch only -> ssosync
#            staging: then next-gen-staging.patch -> ssosync-staging
#
# A feature patch (legacy.patch, next-gen.patch) removes the other
# application's parameters and features and sets the release name (only
# legacy.patch changes it). A staging patch changes only the Name line. There
# are no release patches.
#
# Every patch is applied with no fuzz (patch -F 0), so a hunk whose context no
# longer matches exactly fails the build here. `make sar-variants` applies the
# same patches in the same order. The patches are not regenerated
# automatically: how to regenerate each kind is in the Makefile, above
# sar-variants. A staging patch must change only the Name line: before
# `sam package`, each staging template is checked to differ from its release
# template in that line alone, as `make sar-variants` also checks.
env:
  variables:
    ShareWith: "NOT-SHARED"
phases:
  pre_build:
    commands:
      # Print all environment variables (handy for AWS CodeBuild logs)
      - env
      - ls -laR ${CODEBUILD_SRC_DIR_Built}/
      # Check that the files need to package exist
      - ls README.md
      - ls SAR.md
      - ls SAR-next-gen.md
      - cp ${CODEBUILD_SRC_DIR_Built}/dist/ssosync_linux_arm64_v8.0/ssosync bootstrap
  build:
    commands:
      - |
        set -euo pipefail
        variant() { # <output> <feature patch> [<staging patch>]
          cp template.yaml "$1"
          for p in "$2" ${3:+"$3"}; do
            # -F 0: no fuzz; -N: never offer to reverse a patch.
            if ! patch -N -F 0 "$1" "cicd/build/package/$p"; then
              cat "$1.rej" >&2 || true
              rm -f "$1.orig" "$1.rej"
              echo "error: cicd/build/package/$p does not apply to $1 with no fuzz; regenerate it (see the Makefile, above sar-variants)" >&2
              return 1
            fi
          done
          grep -E '^    (Name|ReadmeUrl):' "$1"
        }
        variant staging.yaml    legacy.patch   legacy-staging.patch
        variant release.yaml    legacy.patch
        variant ng-staging.yaml next-gen.patch next-gen-staging.patch
        variant ng-release.yaml next-gen.patch
        # Staging and release must differ only in the SAR Name line: the diff
        # is exactly one "NcN" hunk whose two sides are both "    Name:" lines.
        names_only() { # <staging> <release>
          diff "$1" "$2" > names.diff || true
          if [ "$(grep -c '' names.diff)" != 4 ] || grep -v -E '^([0-9]+c[0-9]+|---|[<>]     Name: .+)$' names.diff >/dev/null; then
            cat names.diff >&2
            echo "error: $1 and $2 must differ only in their Name line; a staging patch may change only that line (see the Makefile, above sar-variants)" >&2
            return 1
          fi
          rm -f names.diff
        }
        names_only staging.yaml release.yaml
        names_only ng-staging.yaml ng-release.yaml
        for t in staging release ng-staging ng-release; do
          sam package --force-upload --no-progressbar --template-file "$t.yaml" --s3-bucket ${S3Bucket} --output-template-file "packaged-$t.yaml"
          ls "packaged-$t.yaml"
        done
  post_build:
    commands:
      # Create parameters
      - export AppVersion="${GitTag#v}-${GitVersionHash}"
      - aws ssm put-parameter --name "/SSOSync/Staging/Version" --value ${AppVersion} --type String --overwrite
      # Publish both staging applications (sam publish creates an application
      # the first time).
      - |
        set -euo pipefail
        for t in staging ng-staging; do
          echo sam publish --template "packaged-$t.yaml" --semantic-version ${AppVersion}
          sam publish --template "packaged-$t.yaml" --semantic-version ${AppVersion}
        done
      # Share both staging applications with the staging accounts.
      - |
        if expr "${ShareWith}" : "NOT-SHARED" >/dev/null; then
          echo "Skipping Sharing"
        else
          for name in SSOSync-Staging ssosync-staging; do
            aws serverlessrepo put-application-policy \
              --application-id "arn:aws:serverlessrepo:${AWS_REGION}:$(aws sts get-caller-identity --query Account --output text):applications/${name}" \
              --statements Principals=${ShareWith},Actions=Deploy
          done
        fi
artifacts:
  files:
    - packaged-staging.yaml
    - packaged-release.yaml
    - packaged-ng-staging.yaml
    - packaged-ng-release.yaml
