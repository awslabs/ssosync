version: 0.2

# Attribute-map integration test: manager_optin. See run.sh for what it checks.
env:
  shell: bash
  secrets-manager:
    GoogleAdminEmail: SSOSyncGoogleAdminEmail
    SCIMEndpointUrl: SSOSyncSCIMEndpointUrl
    SCIMAccessToken: SSOSyncSCIMAccessToken
  variables:
    GROUP_MATCH: "name:AWS*"

phases:
  build:
    commands:
      - bash tests/attribute_map/manager_optin/run.sh

artifacts:
  files:
    - logs/**/*
