version: 0.2

# Attribute-map integration test: determinism. See run.sh for what it checks.
env:
  shell: bash
  secrets-manager:
    # Keyless Google authentication (tests/wif_account_execution/lib/keyless.sh).
    GoogleCustomerId: SSOSyncGoogleCustomerId
    GoogleImpersonateServiceAccount: SSOSyncGoogleImpersonateServiceAccount
    SCIMEndpointUrl: SSOSyncSCIMEndpointUrl
    SCIMAccessToken: SSOSyncSCIMAccessToken
  variables:
    GROUP_MATCH: "name:AWS*"

phases:
  build:
    commands:
      - bash tests/attribute_map/determinism/run.sh

artifacts:
  files:
    - logs/**/*
