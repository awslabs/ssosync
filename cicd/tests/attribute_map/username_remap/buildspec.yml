version: 0.2

# Attribute-map integration test: username_remap. See run.sh for what it checks.
env:
  shell: bash
  secrets-manager:
    # Keyless Google authentication (tests/wif_account_execution/lib/keyless.sh).
    GoogleCustomerId: SSOSyncNGGoogleCustomerId
    GoogleImpersonateServiceAccount: SSOSyncNGGoogleImpersonateServiceAccount
    SCIMEndpointUrl: SSOSyncNGSCIMEndpointUrl
    SCIMAccessToken: SSOSyncNGSCIMAccessToken
  variables:
    GROUP_MATCH: "name:AWS*"

phases:
  build:
    commands:
      - bash tests/attribute_map/username_remap/run.sh

artifacts:
  files:
    - logs/**/*
