AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: 
  This CloudFormation template will deploy two instances of SSOSync from
  the AWS Serverless Application Repository (SAR). One holding the Secrets 
  and the other the app itself. Choose the Google
  authentication method with AuthMethod, either keyless (Workload Identity Federation,
  release 2.11.0 or later, no key and no admin) or legacy (a stored
  service-account key and a Google admin). The wif-auth/ and legacy-auth/
  folders hold single-method versions of this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AWS IAM Identity Center (Successor to AWS Single Sign-On)
        Parameters:
          - SCIMEndpointUrl
          - SCIMEndpointAccessToken
      - Label:
          default: Google Workspace (set AuthMethod, then the parameters for that method)
        Parameters:
          - AuthMethod
          - GoogleCustomerId
          - GoogleImpersonateServiceAccount
          - GoogleWIFConfig
          - RoleName
          - GoogleAdminEmail
          - GoogleCredentials
      - Label:
          default: Sync Configuration
        Parameters:
          - GoogleUserMatch
          - GoogleGroupMatch
          - SyncSuspended
          - PrecacheOrgUnits
          - ExternalIdChange
          - RetainUnmatched
      - Label:
          default: "Lambda Configuration"
        Parameters:
          - Release
          - ScheduleExpression
          - DryRun
          - MemorySize
          - TimeOut
      - Label:
          default: Log Configuration
        Parameters:
          - LogLevel
          - LogFormat
          - LogRetention


Parameters:
  Release:
    Type: String
    Description: |
      Select the release to deploy. Keyless authentication (AuthMethod) needs 2.11.0 or later.
    #SemanticVersion 
    Default: 2.10.0
    AllowedValues:
      - 2.10.0
      - 2.9.5
      - 2.9.4
      - 2.9.3

  ScheduleExpression:
    Type: String
    Description: |
      [optional] Schedule for trigger the execution of ssosync (see CloudWatch schedule expressions), leave empty if you want to trigger execution by another method such as AWS CodePipeline.
    Default: rate(15 minutes)
    AllowedPattern: '(?!.*\s)|rate\((?:(?:(?:\d{2,}+|[2-9]) (?:minutes|hours|days))|(?:1 (?:minute|hour|day)))\)|(cron\((([0-9]|[1-5][0-9]|60)|\d\/([0-9]|[1-5][0-9]|60)|\*) (([0-9]|[1][0-9]|[2][0-3])|(\d\/([0-9]|[1][0-9]|[2][0-3]))|(([0-9]|[1][0-9]|[2][0-3])-([0-9]|[1][0-9]|[2][0-3]))|\*) (([1-9]|[1-2][0-9]|[3][0-1])|\d\/([1-9]|[1-2][0-9]|[3][0-1])|[1-5]W|L|\*|\?) (([1-9]|[1][1-2])|(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)|((JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV)-(FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC))|(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV)(,(FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)){0,11}|\d\/([0-9]|[1][0-2])|\?|\*) ((MON|TUE|WED|THU|FRI|SAT|SUN)|(MON|TUE|WED|THU|FRI|SAT)-(TUE|WED|THU|FRI|SAT|SUN)|(MON|TUE|WED|THU|FRI|SAT)(,(TUE|WED|THU|FRI|SAT|SUN)){0,6}|[1-7]L|[1-7]#[1-5]|\?|\*) ((19[7-9][0-9]|2[0-1]\d\d)|(19[7-9][0-9]|2[0-1]\d\d)-(19[7-9][0-9]|2[0-1]\d\d)|(19[7-9][0-9]|2[0-1]\d\d)(,(19[7-9][0-9]|2[0-1]\d\d))*|\*)\))'

  LogRetention:
    Type: Number
    Description: |
      How long to retain log for, if you want to retain indefinitely, select 0
    Default: 365
    AllowedValues:
      - 0
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

  LogLevel:
    Type: String
    Description: |
      [required] Log level for Lambda function logging
    Default: warn
    AllowedValues:
      - panic
      - fatal
      - error
      - warn
      - info
      - debug
      - trace

  LogFormat:
    Type: String
    Description: |
      [required] Log format for Lambda function logging
    Default: json
    AllowedValues:
      - json
      - text

  MemorySize:
    Type: Number
    Description: |
      [required] the amount of RAM allocated to the function, within range 128-10240MB. default is 128MB.
    Default: 128
    MinValue: 128
    MaxValue: 10240
     
  TimeOut:
    Type: Number
    Description: |
      [required] Timeout for the Lambda function
    Default: 300
    MinValue: 1
    MaxValue: 900

  SyncSuspended:
    Type: String
    Description: |
      If enabled suspended users that match either the GoogleUserMatch or GoogleGroupMatch criteria they will be replicated.
    Default: ignore
    AllowedValues:
      - ignore
      - sync

  ExternalIdChange:
    Type: String
    Description: |
      When a user (in the Google Workspace Directory) is deleted and recreated, either 'update' the existing IAM Identity Store user, to preserve permission assignments or 'delete and recreate' to prevent permission inheritance.
    Default: delete/recreate
    AllowedValues:
      - delete/recreate
      - update
      
  RetainUnmatched:
    Type: String
    Description: |
      Retain all unmatched users and groups when syncing, users will not be able login without a matching user in the Google Workspace Directory.
    Default: remove
    AllowedValues:
      - remove
      - retain

  DryRun:
    Type: String
    Description: | 
      Enabled Dry Run, means the lambda will execute highlighting the changes it would make to the Identity Store, will not making any changes.
    Default: live
    AllowedValues:
      - live
      - dry-run

  PrecacheOrgUnits:
    Type: String
    Description: | 
       To reduce the volume of apis, ssosync precaches the users and groups from the Google directory. If you directory is large >10,000 users, you may wish to limit the organizational units that are precached. The default is the whole directory '/'. The parameter accpets a comma separate list of OrgUnitPaths, /OU1,/OU2/OU3 in this example all users within the tree of /OU1 and /OU2/OU3 would be precached but not from /OU2 itself. Precaching can be disable by leaving the field empty.
    Default: "/"
    AllowedPattern: '(?!.*\s)|(^\/$)|(\/[a-zA-Z0-9_\/\- ]{0,50})|(\/[a-zA-Z0-9_\/\- ]{0,50})(?:(,\/[a-zA-Z0-9_\/\- ]{1,50}))'

# Secrets
  GoogleCustomerId:
    Type: String
    Description: |
      Google CustomerId, retrieve from https://admin.google.com/ac/accountsettings/profile
    AllowedPattern: '(?:C[0-9a-zA-Z]{8})'

  AuthMethod:
    Type: String
    Description: |
      How ssosync authenticates to Google Workspace. Keyless (Workload Identity Federation, release 2.11.0 or later): set GoogleImpersonateServiceAccount and GoogleWIFConfig, leave GoogleCredentials and GoogleAdminEmail empty. Legacy: set GoogleCredentials and GoogleAdminEmail, leave the keyless parameters empty. See https://github.com/awslabs/ssosync/blob/master/README.md#google-workspace-setup
    Default: Legacy (stored credentials)
    AllowedValues:
      - Workload Identity Federation (keyless)
      - Legacy (stored credentials)

  GoogleImpersonateServiceAccount:
    Type: String
    Description: |
      Keyless only: the email of the Google service account ssosync impersonates, with a read-only Workspace admin role assigned to it (README, Workload Identity Federation, steps 2-3).
    Default: ""
    AllowedPattern: '(?!.*\s)|(?:[a-z0-9][a-z0-9-]{4,28}[a-z0-9]@[a-z0-9.-]+\.gserviceaccount\.com)'
    ConstraintDescription: 'Must be empty or a Google service account email (...@<project>.iam.gserviceaccount.com).'

  GoogleWIFConfig:
    Type: String
    Description: |
      Keyless only: the Workload Identity Federation credential configuration, the contents of wif-config.json (README, Workload Identity Federation, step 6), for the provider that trusts this account and RoleName. It holds no secret values; it is stored in the SSOSyncGoogleWIFConfig secret.
    Default: ""
    AllowedPattern: '(?!.*\s)|(?s:\s*\{.*\}\s*)'
    ConstraintDescription: 'Must be empty or the credential configuration JSON (a JSON object).'

  RoleName:
    Type: String
    Description: |
      [optional] The name of the IAM role the function runs as (release 2.11.0 or later). Keyless: the role your Google workload identity provider trusts; empty means SSOSync_ExecutionRole. Legacy: empty lets CloudFormation generate a name.
    Default: ""
    AllowedPattern: '(?!.*\s)|[\w+=,.@-]{1,64}'

  GoogleCredentials:
    Type: String
    Description: |
      Legacy only: credentials to log into Google (content of credentials.json)
    Default: ""
    AllowedPattern: '(?!.*\s)|(\{(\s)*(".*")(\s)*:(\s)*(".*")(\s)*\})'
    NoEcho: true

  GoogleAdminEmail:
    Type: String
    Description: |
      Legacy only: Google Admin email
    Default: ""
    AllowedPattern: '(?!.*\s)|(([a-zA-Z0-9.+=_-]{0,61})@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*)'
    NoEcho: true

  SCIMEndpointUrl:
    Type: String
    Description: |
      AWS IAM Identity Center - SCIM Endpoint Url
    AllowedPattern: '(https://scim.(us(-gov)?|ap|ca|cn|eu|il|me|mx|sa)-(central|(north|south)?(east|west)?)-([0-9]{1})(.amazonaws.com|.api.aws)/([A-Za-z0-9]{8,11})-([A-Za-z0-9]{4})-([A-Za-z0-9]{4})-([A-Za-z0-9]{4})-([A-Za-z0-9]{12})/scim/v2/?)'

  SCIMEndpointAccessToken:
    Type: String
    Description: |
      AWS IAM Identity Center - SCIM AccessToken
    AllowedPattern: '([0-9a-zA-Z/=+-\\]{500,620})'
    NoEcho: true

  GoogleUserMatch:
    Type: String
    Description: |
      [optional] Google Workspace Users filter query parameter, a simple '*' denotes sync all users in the directory. example: 'name:John*,email:admin*', '*' or name=John Doe,email:admin*' see: https://developers.google.com/admin-sdk/directory/v1/guides/search-users, if left empty no users will be selected but if a pattern has been set for GroupMatch users that are members of the groups it matches will still be selected.
    Default: ""
    AllowedPattern: '(?!.*\s)|(\*)|(?:(?:((?:(?i)name|managerId|orgName|orgDepartment|orgCostCenter)(?:(?::[a-zA-Z0-9\-_]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")))|((?:(?i)email|manager)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?::[a-zA-Z0-9.\-_]{1,64}\*))))(([, ]{1,2})(?:((?:(?i)name|manager|managerId|orgName|orgDepartment|orgCostCenter)(?:(?::[a-zA-Z0-9\-_ ]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")))|((?:(?i)email|manager)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?::[a-zA-Z0-9.\-_]{1,64}\*)))))*)'

  GoogleGroupMatch:
    Type: String
    Description: |
      [optional] Google Workspace Groups filter query parameter, a simple '*' denotes sync all groups (and any users that are members of those groups). example: 'name:Admin*,email:aws-*', 'name=Admins' or '*' see: https://developers.google.com/admin-sdk/directory/v1/guides/search-groups, if left empty no groups will be selected.
    Default: "*"
    AllowedPattern: '(?!.*\s)|(\*)|(?:(?:((?:(?i)name)(?:(?::[a-zA-Z0-9\-_]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")))|(?:(?i)memberkey=)(?:(?:[a-zA-Z0-9\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260})|(?:(?:[a-zA-Z0-9.\-_]{1,64}))|(?:\"[a-zA-Z0-9\-_ ]{1,64}\"))|((?:(?i)email)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?::[a-zA-Z0-9.\-_]{1,64}\*))))(([, ]{1,2})(?:((?:(?i)name)(?:(?::[a-zA-Z0-9\-_ ]{1,64}\*)|(?:=[a-zA-Z0-9\-_]{1,64})|(?:=\"[a-zA-Z0-9\-_ ]{1,64}\")))|(?:(?i)memberkey=)(?:(?:[a-zA-Z0-9\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260})|(?:(?:[a-zA-Z0-9.\-_]{1,64}))|(?:\"[a-zA-Z0-9\-_ ]{1,64}\"))|((?:(?i)email)(?:(?:=(?:[a-zA-Z0-9.\-_]{1,64})@(?:[a-zA-Z0-9.\-]{5,260}))|(?::[a-zA-Z0-9.\-_]{1,64}\*)))))*)'


Conditions:
  UseWIF: !Equals [!Ref AuthMethod, Workload Identity Federation (keyless)]
  SetRoleName: !Not
    - !Equals [!Ref RoleName, ""]

Rules:
  # Exactly the parameters of the chosen AuthMethod.
  KeylessAuth:
    RuleCondition: !Equals [!Ref AuthMethod, Workload Identity Federation (keyless)]
    Assertions:
      - Assert: !Not [!Equals ['', !Ref GoogleImpersonateServiceAccount]]
        AssertDescription: 'Keyless authentication needs GoogleImpersonateServiceAccount.'
      - Assert: !Not [!Equals ['', !Ref GoogleWIFConfig]]
        AssertDescription: 'Keyless authentication needs GoogleWIFConfig (the contents of wif-config.json).'
      - Assert: !Equals ['', !Ref GoogleCredentials]
        AssertDescription: 'Keyless authentication uses no key: leave GoogleCredentials empty.'
      - Assert: !Equals ['', !Ref GoogleAdminEmail]
        AssertDescription: 'Keyless authentication uses no admin: leave GoogleAdminEmail empty.'
      - Assert: !Not [!Contains [[2.10.0, 2.9.5, 2.9.4, 2.9.3], !Ref Release]]
        AssertDescription: 'Keyless authentication needs release 2.11.0 or later.'
  LegacyAuth:
    RuleCondition: !Equals [!Ref AuthMethod, Legacy (stored credentials)]
    Assertions:
      - Assert: !Not [!Equals ['', !Ref GoogleCredentials]]
        AssertDescription: 'Legacy authentication needs GoogleCredentials (the content of credentials.json).'
      - Assert: !Not [!Equals ['', !Ref GoogleAdminEmail]]
        AssertDescription: 'Legacy authentication needs GoogleAdminEmail.'
      - Assert: !Equals ['', !Ref GoogleImpersonateServiceAccount]
        AssertDescription: 'GoogleImpersonateServiceAccount is only used for keyless authentication: leave it empty, or set AuthMethod to keyless.'
      - Assert: !Equals ['', !Ref GoogleWIFConfig]
        AssertDescription: 'GoogleWIFConfig is only used for keyless authentication: leave it empty, or set AuthMethod to keyless.'

Resources:

  Function:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-2:004480582608:applications/SSOSync
        SemanticVersion: !Ref Release
      Parameters:
        DeployPattern: App only
        FunctionName: SSOSync
        SCIMEndpointUrl: !GetAtt [Secrets, Outputs.SCIMEndpointUrl]
        SCIMEndpointAccessToken: !GetAtt [Secrets, Outputs.SCIMEndpointAccessToken]
        GoogleCustomerId: !GetAtt [Secrets, Outputs.GoogleCustomerId]
        # Only the chosen method's parameters are passed, so a legacy
        # deployment of an earlier release gets exactly what it always did.
        GoogleAdminEmail: !If [UseWIF, !Ref AWS::NoValue, !GetAtt [Secrets, Outputs.GoogleAdminEmail]]
        GoogleCredentials: !If [UseWIF, !Ref AWS::NoValue, !GetAtt [Secrets, Outputs.GoogleCredentials]]
        GoogleImpersonateServiceAccount: !If [UseWIF, !GetAtt [Secrets, Outputs.GoogleImpersonateServiceAccount], !Ref AWS::NoValue]
        GoogleWIFConfig: !If [UseWIF, !GetAtt [Secrets, Outputs.GoogleWIFConfig], !Ref AWS::NoValue]
        RoleName: !If
          - SetRoleName
          - !Ref RoleName
          - !If [UseWIF, SSOSync_ExecutionRole, !Ref AWS::NoValue]
        PrecacheOrgUnits: !Ref PrecacheOrgUnits
        GoogleUserMatch: !Ref GoogleUserMatch
        GoogleGroupMatch: !Ref GoogleGroupMatch
        SyncMethod: groups
        ScheduleExpression: !Ref ScheduleExpression
        SyncSuspended: !Ref SyncSuspended
        ExternalIdChange: !Ref ExternalIdChange
        RetainUnmatched: !Ref RetainUnmatched
        DryRun: !Ref DryRun
        MemorySize: !Ref MemorySize
        TimeOut: !Ref TimeOut
        LogLevel: !Ref LogLevel
        LogFormat: !Ref LogFormat
        LogRetention: !Ref LogRetention
  
  Secrets:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-2:004480582608:applications/SSOSync
        SemanticVersion: !Ref Release
      Parameters:
        DeployPattern: Secrets only
        SCIMEndpointUrl: !Ref SCIMEndpointUrl
        SCIMEndpointAccessToken: !Ref SCIMEndpointAccessToken
        GoogleCustomerId: !Ref GoogleCustomerId
        GoogleAdminEmail: !If [UseWIF, !Ref AWS::NoValue, !Ref GoogleAdminEmail]
        GoogleCredentials: !If [UseWIF, !Ref AWS::NoValue, !Ref GoogleCredentials]
        GoogleImpersonateServiceAccount: !If [UseWIF, !Ref GoogleImpersonateServiceAccount, !Ref AWS::NoValue]
        GoogleWIFConfig: !If [UseWIF, !Ref GoogleWIFConfig, !Ref AWS::NoValue]

Outputs:
  RoleName:
    Condition: UseWIF
    Description: "The name of the IAM role the function runs as; your Google workload identity provider must trust it"
    Value: !GetAtt [Function, Outputs.RoleName]
