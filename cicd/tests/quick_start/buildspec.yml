version: 0.2
# Quick-start template smoke test (release pipeline, delegated admin account).
# The CodeBuild project sets QUICKSTART_TEMPLATE, STACK_NAME and CFN_ROLE_ARN
# (and, for the attribute-map template, ATTRIBUTE_MAP_FILE and
# EXPECT_ATTRIBUTE_MAP). See run.sh.
env:
  shell: bash
  variables:
    GROUP_MATCH: "name:AWS*"
phases:
  install:
    commands:
      - pip3 install --quiet pyyaml
  build:
    commands:
      - bash tests/quick_start/run.sh
