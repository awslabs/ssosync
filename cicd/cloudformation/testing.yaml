          Status: ENABLED

  CodeBuildQuickStartPackageLogs:
    Type: AWS::Logs::LogStream
    Condition: DeployDelegated
    Properties:
      LogGroupName: !Ref CodePipelineLogGroup
      LogStreamName: SSOSync-QuickStart-Package

  CodeBuildTestingAppStack:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: SSOSync-Testing-AppStack
      Description: "Deploy and execute an app stack deployment of ssosync into the Delegated account"
      ServiceRole: !Ref CodeBuildTestRole
      Source:
        Type: CODEPIPELINE
        BuildSpec: "tests/deploy_patterns/crossaccount/appstack/buildspec.yml"
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ARTIFACT_S3_BUCKET
            Value: !Sub ${ArtifactBucket}
          - Name: AppArn
            Value: !Sub "arn:aws:serverlessrepo:${AWS::Region}:${AWS::AccountId}:applications/SSOSync-Staging"
          - Name: TARGETS3BUCKET
            Value: !Sub ${DelegatedBucket}
          - Name: StagingRole
            Value: !Sub "arn:aws:iam::${DelegatedAccount}:role/SSOSync-ProdAccount-${AWS::Region}"
          - Name: pipeline
            Value: "SSSOSync-CrossAccountApp"
      Artifacts:
        Name: SSOSync
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref CodePipelineLogGroup
          StreamName: !Ref CodeBuildTestingLogs
          Status: ENABLED

  CodeBuildTestingLogs:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref CodePipelineLogGroup
      LogStreamName: SSOSync-Testing

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-CodePipeline-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal: 
            Service: [codepipeline.amazonaws.com] 
      Path: /
      Policies: 
        - PolicyName: !Sub SSOSync-CodePipeline-${AWS::Region}
          PolicyDocument:                     
            Version: '2012-10-17'
            Statement: 
            - Action:
              - 'iam:PassRole'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'codebuild:BatchGetBuilds'
              - 'codebuild:StartBuild'
              Resource:
              - !Sub ${CodeBuildSmokeCLI.Arn}
              - !Sub ${CodeBuildSmokeLambda.Arn}
              - !Sub ${CodeBuildUserGroupOperations.Arn}
              - !Sub ${CodeBuildWIFLambda.Arn}
              - !Sub ${CodeBuildWIFCLI.Arn}
              # Attribute-map test projects exist in the delegated account only.
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapInvalidMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapDefaultMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapDeterminism.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapRichMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapValidationWarnings.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapUsernameRemap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapManagerOptIn.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapLambdaDefault.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildAttrMapLambdaInlineMap.Arn, !Ref AWS::NoValue]
              - !If [DeployDelegated, !GetAtt CodeBuildQuickStartPackage.Arn, !Ref AWS::NoValue]
              Effect: Allow
            - Action:
              - 's3:GetBucketPolicy'
              - 's3:GetBucketVersioning'
              Resource:
              - !Sub ${ArtifactBucket.Arn}
              - !Sub ${StagingBucket.Arn}
              Effect: Allow
            - Action:
              - 's3:*'
              Resource:
              - !Sub ${ArtifactBucket.Arn}/*
              - !Sub ${StagingBucket.Arn}/*
              Effect: Allow
            - Action:
              - 'kms:DescribeKey'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:Decrypt'
              Effect: Allow
              Resource:
              - !GetAtt ArtifactBucketKey.Arn
            - Action:
              - 'lambda:InvokeFunction'
              Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SSOSyncFunction
              # QuickStart-* (the quick-starts name their function SSOSync)
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SSOSync
              Effect: Allow
            - Action:
              - 'cloudformation:CreateStack'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DeleteStack'
              - 'cloudformation:UpdateStack'
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:SetStackPolicy'
              Resource:
              - '*'
              Effect: Allow

  ProdAccountRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-ProdAccount-${AWS::Region}
      AssumeRolePolicyDocument:
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal: 
            AWS: !Ref ProductionAccount
        Version: '2012-10-17'
      Path: /
      Policies: 
        - PolicyName: !Sub SSOSync-ProdAccount-${AWS::Region}
          PolicyDocument:                     
            Version: '2012-10-17'
            Statement: 
            - Action:
              - 'codepipeline:*'
              Effect: Allow
              Resource:
              - '*'
            - Action:
              - 's3:GetBucketPolicy'
              - 's3:GetBucketVersioning'
              Resource:
              - !Sub ${StagingBucket.Arn}
              Effect: Allow
            - Action:
              - 's3:*'
              Resource:
              - !Sub ${StagingBucket.Arn}/*
              Effect: Allow

  CodeBuildTestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SSOSync-CodeBuild-Test-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [codebuild.amazonaws.com]
      Path: /
      Policies:
        - PolicyName: !Sub SSOSync-CodeBuild-Test-${AWS::Region}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'kms:DescribeKey'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:Decrypt'
              Effect: Allow
              Resource:
              - !GetAtt ArtifactBucketKey.Arn
            - Action: 's3:*'
              Effect: Allow
              Resource:
              - !Sub ${ArtifactBucket.Arn}/*
            - Action:
              -  'lambda:invokeFunction'
              Effect: Allow
              Resource: '*'
            # tests/wif_account_execution/lambda checks the function is keyless.
            - Action:
              - 'lambda:GetFunctionConfiguration'
              Effect: Allow
              Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SSOSyncFunction
            - Action:
                - "identitystore:ListGroups"
                - "identitystore:ListUsers"
                - "identitystore:ListGroupMemberships"
                - "identitystore:IsMemberInGroups"
                - "identitystore:GetGroupMembershipId"
              Effect: Allow
              Resource: '*'
            # tests/user_group_operations: set up local, foreign and missing
            # records to exercise every user/group operation (issue #383).
            - Action:
                - "identitystore:CreateUser"
                - "identitystore:CreateGroup"
                - "identitystore:UpdateUser"
                - "identitystore:UpdateGroup"
                - "identitystore:DeleteUser"
                - "identitystore:DeleteGroup"
              Effect: Allow
              Resource: '*'
            # tests/attribute_map (delegated account only): import.py resets the
            # dedicated test Identity Store to the baseline (memberships
            # included), and the ssosync CLI describes records when reading back
            # attributes.
            - !If
              - DeployDelegated
              - Action:
                  - "identitystore:CreateGroupMembership"
                  - "identitystore:DeleteGroupMembership"
                  - "identitystore:DescribeUser"
                  - "identitystore:DescribeGroup"
                Effect: Allow
                Resource: '*'
              - !Ref AWS::NoValue
            # Attribute-map Lambda tests read the function's log lines for assertions.
            - !If
              - DeployDelegated
              - Action:
                  - "logs:FilterLogEvents"
                Effect: Allow
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/SSOSyncFunction:*
              - !Ref AWS::NoValue
            - Sid: SsoAdminAccessPolicy
              Effect: Allow
              Action: 
                - "sso:ListInstances"
              Resource:
                - "*"
            - Action:
                - "secretsmanager:Get*"
              Resource:
                - "*"
              Effect: Allow
            # Keyless ssosync runs (tests/wif_account_execution/lib/keyless.sh):
            # the CLI's Google provider trusts only SSOSync_CLIExecutionRole.
            - Action:
                - "sts:AssumeRole"
              Effect: Allow
              Resource:
                - !Sub arn:aws:iam::${AWS::AccountId}:role/SSOSync_CLIExecutionRole

  # The service role of the WIFAuth CLI test (tests/wif_account_execution/cli).
  # ssosync federates to Google as this role, so its name is fixed: this
  # account's <AccountId>-cli Google provider trusts it. Only what the CLI
  # needs to sync.
  CodeBuildWIFCLIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SSOSync_CLIExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [codebuild.amazonaws.com]
        # The attribute-map and user/group-operations tests run ssosync keyless
        # in a session of this role (tests/wif_account_execution/lib/keyless.sh).
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            AWS: !GetAtt CodeBuildTestRole.Arn
      Path: /
      Policies:
        - PolicyName: !Sub SSOSync-CodeBuild-WIF-CLI-${AWS::Region}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'kms:DescribeKey'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:Decrypt'
              Effect: Allow
              Resource:
              - !GetAtt ArtifactBucketKey.Arn
            - Action: 's3:*'
              Effect: Allow
              Resource:
              - !Sub ${ArtifactBucket.Arn}/*
            - Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
              Effect: Allow
              Resource:
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:SSOSync*
            - Action:
              - 'sso:ListInstances'
              Effect: Allow
              Resource: '*'
            - Action:
              - 'identitystore:ListGroups'
              - 'identitystore:ListUsers'
              - 'identitystore:ListGroupMemberships'
              - 'identitystore:IsMemberInGroups'
              - 'identitystore:GetGroupMembershipId'
              Effect: Allow
              Resource: '*'

  CloudFormationDeployerRole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub SSOSync-CloudFormationDeployerRole-${AWS::Region}
      AssumeRolePolicyDocument: 
        Statement:
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:  
            Service: [cloudformation.amazonaws.com] 
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            AWS: !Ref AWS::AccountId
        - Action: ['sts:AssumeRole']
          Effect: Allow
          Principal:
            Service: [codepipeline.amazonaws.com]
        Version: '2012-10-17'
      Path: /
      Policies: 
        - PolicyName: CloudFormation-Deployer-Policy
          PolicyDocument:                     
            Version: '2012-10-17'
            Statement:
            - Action: '*'
              Effect: Allow
              Resource: '*'

Outputs:

  ManagementAccount:
    Condition: DeployManagement
    Description: "The account id"
    Value: !Ref AWS::AccountId
  ManagementBucket:
    Condition: DeployManagement
    Description: "Management account bucket name"
    Value: !Ref StagingBucket
  DelegatedAccount:
    Condition: DeployDelegated
    Description: "The account id"
    Value: !Ref AWS::AccountId
  DelegatedBucket:
    Condition: DeployDelegated
    Description: "Delegated account bucket name"
    Value: !Ref StagingBucket
  NonDelegatedAccount:
    Condition: DeployNonDelegated
    Description: "The account id"
    Value: !Ref AWS::AccountId
  NonDelegatedBucket:
    Condition: DeployNonDelegated
    Description: "Delegated account bucket name"
    Value: !Ref StagingBucket
