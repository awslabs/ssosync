# .github/workflows/release.yaml
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache development tools
        uses: actions/cache@v6
        with:
          path: .bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Run CI pipeline
        run: make test-coverage
        
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Unshallow
        run: git fetch --prune --unshallow
        
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'


      - name: Cache development tools
        uses: actions/cache@v6
        with:
          path: .bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tools-
          
      - name: Create release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-changelog
          path: dist/CHANGELOG.md
          retention-days: 1

  sar:
    runs-on: ubuntu-latest
    needs: [ release ]
    steps:
      - name: configure AWS creds
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::004480582608:role/SSOSync-GitHubActions
          role-duration-seconds: 7200
      - name: Start CodePipeline
        uses: moia-oss/aws-codepipeline-trigger@v2.1.0
        with:
          pipeline: SSOSync-Build
          wait: true # optional (default: false)
          follow-codebuild: false # optional (default: false)

  post_release:
    runs-on: ubuntu-latest
    needs: [ release ]
    # Skip prerelease tags (e.g. v3.0.0-rc.1); only run for final releases.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true

      - name: Fetch SEMANTIC_VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "SEMANTIC_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Show SemanticVersion
        run: |
          echo "env.SemanticVersion: ${{ env.SEMANTIC_VERSION }}"

      - name: Show current SemanticVersion
        run: grep SemanticVersion quick-start/*.yaml || true

      - name: Update Templates
        run: |
          git grep -lr -e '#SemanticVersion' -- quick-start | xargs sed -i -E -e "/^[[:space:]]*#[[:space:]]*Semantic ?Version[[:space:]]*$/{
          n
          /^[[:space:]]*Default: ${{ env.SEMANTIC_VERSION }}$/b
          s/^([[:space:]]*Default: ).*$/\1${{ env.SEMANTIC_VERSION }}/
          n
          a\\      - ${{ env.SEMANTIC_VERSION }}
          }"

      - name: Show Templates SemanticVersion
        run: grep SemanticVersion quick-start/*.yaml || true

      - name: Download release changelog
        uses: actions/download-artifact@v7
        with:
          name: release-changelog
          path: release-notes

      - name: Load release notes
        run: |
          {
            echo 'RELEASE_NOTES<<RELEASE_NOTES_EOF'
            cat release-notes/CHANGELOG.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_ENV"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.ref_name }}
          release-notes: ${{ env.RELEASE_NOTES }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: master
          commit_message: Update CHANGELOG and Quick Start templates
          file_pattern: 'CHANGELOG.md quick-start'
