AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: 
  This CloudFormation template will deploy a full CI/CD pipeline for testing SSO
  Sync, within a staging account, triggered from a build pipeline in a production
  account.

Parameters:
  ProductionAccount:
    Description: AWS Account where the build pipeline in deployed
    Default: "004480582608"
    Type: String
    AllowedPattern: '[0-9]+'
  TestAccount:
    Description: The test account type
    Default: "Management"
    Type: String
    AllowedValues:
      - Management
      - Delegated
      - NonDelegated
  DelegatedAccount:
    Description: The account id of the account setup as delegated admin
    Default: "622987834645"
    Type: String
  DelegatedBucket:
    Description: The S3 bucket arn from the testing stack in the the delegated account
    Type: String


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Production Account
        Parameters:
          - ProductionAccount
      - Label:
          default: Testing Account
        Parameters:
          - TestAccount
      - Label:
          default: Delegated Account
          description: Only required for when deploying in the management account
        Parameters:
          - DelegatedAccount
          - DelegatedBucket
            
    ParameterLabels:
      ProductionAccount:
        default: "ProductionAccount"
      TestAccount:
        default: "Account Type"
      DelegatedAccount:
        default: "Only required for Management Account"
      DelegatedBucket:
        default: "bucket in the Delegated Account"

Conditions:
  DeployManagement: !Equals [ !Ref TestAccount, Management]
  DeployDelegated: !Equals [ !Ref TestAccount, Delegated]
  DeployNonDelegated: !Equals [ !Ref TestAccount, NonDelegated]

Resources:

  CodePipelineLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    Properties: 
      LogGroupName: SSOSync-Test
      RetentionInDays: 120

  ArtifactBucketKey:
    Type: AWS::KMS::Key
    Properties: 
      Description: Key for this CodePipeline
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Principal:
            AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
          Action: 'kms:*'
          Resource: '*'

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt ArtifactBucketKey.Arn 
            BucketKeyEnabled: true

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyUnEncryptedObjectUploads
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            StringNotEquals: 
              s3:x-amz-server-side-encryption: aws:kms
        - Sid: RequireKMSEncryption
          Effect: Deny
          Principal: "*"
          Action: s3:PutObject
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition:
            StringNotLikeIfExists:
              s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ArtifactBucketKey.Arn
        - Sid: DenyInsecureConnections
          Effect: Deny
          Principal: "*"
          Action: "s3:*"
          Resource: !Sub ${ArtifactBucket.Arn}/*
          Condition: 
            Bool: 
              aws:SecureTransport: false

  StagingBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete
    Properties:
      VersioningConfiguration:
        Status: Enabled

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: ['s3:GetObject']
          Effect: Allow
          Principal:
            Service: 'codepipeline.amazonaws.com'
          Resource:
          - !Sub ${StagingBucket.Arn}/*
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId

  CodePipelineTestAccountExecution:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: SSOSync-Test-Account_Execution
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: tests.zip
                PollForSourceChanges: false
        # All tests run in one stage, in sequence, as in the developer
        # pipeline (actions prefixed with their block). Every account runs
        # WIFAuth and LegacyAuth (with their Deploy- and CleanUp- actions);
        # the delegated administrator account also runs AttributeMap,
        # Functional and QuickStart (they reset and use its dedicated test
        # Identity Store).
        - Name: Tests
          Actions:
            # Workload Identity Federation (keyless, issue #345) with no admin (the
            # service account acts as itself, issue #192), first so a keyless
            # failure fails fast: deploy from deploy/wif-<AccountId>.json (no key,
            # no admin, the customer id, RoleName SSOSync_ExecutionRole), then the
            # Lambda, CLI and CodePipeline tests. See tests/wif_account_execution/.
            - Name: Deploy-WIFAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                TemplatePath: 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 1
            - Name: WIFAuth-Lambda
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildWIFLambda
                PrimarySource: Tests
              OutputArtifacts:
                - Name: WIFLambda
              InputArtifacts:
                - Name: Tests
            - Name: WIFAuth-CLI
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 3
              Configuration:
                ProjectName: !Ref CodeBuildWIFCLI
                PrimarySource: Tests
              OutputArtifacts:
                - Name: WIFCLI
              InputArtifacts:
                - Name: Tests
            - Name: WIFAuth-CodePipeline
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 4
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: WIFCodePipeline
              InputArtifacts:
                - Name: Tests
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - Name: CleanUp-WIFAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 5
            # Legacy auth (stored credentials): the service-account key and an admin
            # to act on behalf of (deploy/developer.json).
            - Name: Deploy-LegacyAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/developer.json'
                TemplatePath: !Sub 'Tests::deploy/stack.yml'
              InputArtifacts:
                - Name: Tests
              RunOrder: 6
            - Name: LegacyAuth-Lambda
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 7
              Configuration:
                ProjectName: !Ref CodeBuildSmokeLambda
                PrimarySource: Tests
              OutputArtifacts:
                - Name: SmokeLambda
              InputArtifacts:
                - Name: Tests
            - Name: LegacyAuth-CLI
              ActionTypeId:
                Category: Test
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 8
              Configuration:
                ProjectName: !Ref CodeBuildSmokeCLI
                PrimarySource: Tests
              OutputArtifacts:
                - Name: SmokeCLI
              InputArtifacts:
                - Name: Tests
            - Name: LegacyAuth-CodePipeline
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Version: 1
                Provider: Lambda
              RunOrder: 9
              Configuration:
                FunctionName: SSOSyncFunction
              OutputArtifacts:
                - Name: SmokeCodePipeline
              InputArtifacts:
                - Name: Tests
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - Name: CleanUp-LegacyAuth
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestAccountExecution
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 10
            # Attribute-map integration tests (cicd/tests/attribute_map/). They share
            # one Identity Store, so every action runs in sequence (distinct RunOrder).
            # Each live test resets the Identity Store to tests/attribute_map/baseline/.
            # Keyless deployment (deploy/wif-<AccountId>.json): the CLI tests run ssosync
            # keyless with its SSOSync* secrets, the Lambda tests invoke SSOSyncFunction.
            - !If
              - DeployDelegated
              - Name: Deploy-AttributeMap
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: TestAccountExecution
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                  TemplatePath: !Sub 'Tests::deploy/stack.yml'
                InputArtifacts:
                  - Name: Tests
                RunOrder: 11
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-InvalidMap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 12
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapInvalidMap
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapInvalidMap
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-DefaultMap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 13
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapDefaultMap
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapDefaultMap
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-Determinism
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 14
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapDeterminism
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapDeterminism
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-RichMap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 15
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapRichMap
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapRichMap
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-ValidationWarnings
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 16
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapValidationWarnings
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapValidationWarnings
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-UsernameRemap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 17
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapUsernameRemap
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapUsernameRemap
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-ManagerOptIn
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 18
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapManagerOptIn
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapManagerOptIn
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-LambdaDefaultMap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 19
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapLambdaDefault
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapLambdaDefault
              - !Ref AWS::NoValue
            # Redeploy the (keyless) function with maps/rich.json inline in ATTRIBUTE_MAP.
            - !If
              - DeployDelegated
              - Name: AttributeMap-DeployInlineAttributeMap
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: TestAccountExecution
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/attributemap-${AWS::AccountId}.json'
                  TemplatePath: 'Tests::deploy/stack.yml'
                InputArtifacts:
                  - Name: Tests
                RunOrder: 20
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: AttributeMap-LambdaInlineMap
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 21
                Configuration:
                  ProjectName: !Ref CodeBuildAttrMapLambdaInlineMap
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: AttrMapLambdaInlineMap
              - !Ref AWS::NoValue
            # Remove TestAccountExecution, so the next block starts from a fresh deployment.
            - !If
              - DeployDelegated
              - Name: CleanUp-AttributeMap
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: TestAccountExecution
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                InputArtifacts:
                  - Name: Tests
                RunOrder: 22
              - !Ref AWS::NoValue
            # Functional tests against the live tenant.
            # Keyless deployment (deploy/wif-<AccountId>.json): ssosync runs keyless with its SSOSync* secrets.
            - !If
              - DeployDelegated
              - Name: Deploy-Functional
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: TestAccountExecution
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/wif-${AWS::AccountId}.json'
                  TemplatePath: !Sub 'Tests::deploy/stack.yml'
                InputArtifacts:
                  - Name: Tests
                RunOrder: 23
              - !Ref AWS::NoValue
            # Live proof of getUserOperations/getGroupOperations (issue #383):
            # expected IssuerArn == the real ExternalId Issuer, managed records
            # converge, multi-ExternalId records use this tenant's entry, and the
            # ExternalId-change path (Recreate/UpdateForced) works.
            # See cicd/tests/user_group_operations/run.sh.
            - !If
              - DeployDelegated
              - Name: UserGroupOperations
                ActionTypeId:
                  Category: Test
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 24
                Configuration:
                  ProjectName: !Ref CodeBuildUserGroupOperations
                  PrimarySource: Tests
                OutputArtifacts:
                  - Name: UserGroupOperations
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            # Quick-start templates (quick-start/*.yaml, wif-auth/, legacy-auth/)
            # against the build under test. Configurations (tests/quick_start/
            # build.py) wrote a wrapper per test that deploys the quick-start as a
            # nested stack, passing every secret as a Secrets Manager dynamic
            # reference, and per-account parameter files of secret Arns.
            # QuickStart-Package uploads the nested templates (only) to this
            # account's artifact bucket. Each quick-start then updates the same
            # QuickStartTests stack and the function is invoked, so unchanged
            # resources (the IAM role, ...) carry over; the order moves from the
            # legacy templates to the keyless ones, a legacy -> keyless upgrade.
            # Every quick-start creates the SSOSync* secrets, which
            # TestAccountExecution (App + secrets) also creates, so that stack is
            # removed first.
            - !If
              - DeployDelegated
              - Name: CleanUp-Functional
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: TestAccountExecution
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                InputArtifacts:
                  - Name: Tests
                RunOrder: 25
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-Package
                ActionTypeId:
                  Category: Build
                  Owner: AWS
                  Version: 1
                  Provider: CodeBuild
                RunOrder: 26
                Configuration:
                  ProjectName: !Ref CodeBuildQuickStartPackage
                  PrimarySource: Tests
                InputArtifacts:
                  - Name: Tests
                OutputArtifacts:
                  - Name: QuickStarts
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-LegacySingleAccount
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/LegacySingleAccount-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/LegacySingleAccount.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 27
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-LegacySingleAccount
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 28
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-LegacySingleAccountAttributeMap
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/LegacySingleAccountAttributeMap-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/LegacySingleAccountAttributeMap.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 29
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-LegacySingleAccountAttributeMap
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 30
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-SingleAccount
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccount-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/SingleAccount.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 31
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-SingleAccount
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 32
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-SingleAccountAttributeMap
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccountAttributeMap-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/SingleAccountAttributeMap.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 33
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-SingleAccountAttributeMap
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 34
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-SingleAccountWIF
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccountWIF-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/SingleAccountWIF.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 35
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-SingleAccountWIF
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 36
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: Deploy-QuickStart-SingleAccountAttributeMapWIF
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: '1'
                  Provider: CloudFormation
                Configuration:
                  ActionMode: CREATE_UPDATE
                  Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                  TemplateConfiguration: !Sub 'Tests::deploy/quick-start-tests/SingleAccountAttributeMapWIF-${AWS::AccountId}.json'
                  TemplatePath: 'QuickStarts::packaged/SingleAccountAttributeMapWIF.yml'
                InputArtifacts:
                  - Name: Tests
                  - Name: QuickStarts
                RunOrder: 37
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: QuickStart-SingleAccountAttributeMapWIF
                ActionTypeId:
                  Category: Invoke
                  Owner: AWS
                  Version: 1
                  Provider: Lambda
                RunOrder: 38
                Configuration:
                  FunctionName: SSOSync
                InputArtifacts:
                  - Name: Tests
              - !Ref AWS::NoValue
            - !If
              - DeployDelegated
              - Name: CleanUp-QuickStart
                ActionTypeId:
                  Category: Deploy
                  Owner: AWS
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: QuickStartTests
                  RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                InputArtifacts:
                  - Name: Tests
                RunOrder: 39
              - !Ref AWS::NoValue

  CodePipelineDeployCrossAccountSecrets:
    Type: AWS::CodePipeline::Pipeline
    Condition: DeployManagement
    Properties:
      Name: SSOSync-Deploy_CrossAccount_Secrets
      RoleArn: !Sub ${CodePipelineRole.Arn}
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !GetAtt ArtifactBucketKey.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Tests
              Namespace: Test
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: Tests
              RunOrder: '1'
              Configuration:
                S3Bucket: !Ref StagingBucket
                S3ObjectKey: crossaccount_secrets.zip
                PollForSourceChanges: false
        - Name: Deploy
          Actions:
            - Name: DeploySecrets
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                StackName: TestCrossAccountSecrets
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
                TemplateConfiguration: 'Tests::deploy/crossaccountsecrets.json'
                TemplatePath: !Sub 'Tests::deploy/crossaccountsecrets.yml'
                OutputFileName: crossaccountapp.json
              InputArtifacts:
                - Name: Tests
              OutputArtifacts:
                - Name: Secrets
              RunOrder: 1
            - Name: DeployAppInDelegated
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              RunOrder: 2
              Configuration:
                ProjectName: !Ref CodeBuildTestingAppStack
                PrimarySource: Tests
              InputArtifacts:
                - Name: Tests
                - Name: Secrets
        - Name: CleanUp
          Actions:
            - Name: RemoveStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CloudFormation
              Configuration:
                ActionMode: DELETE_ONLY
                StackName: TestCrossAccountSecrets
                RoleArn: !GetAtt [CloudFormationDeployerRole, Arn]
              InputArtifacts:
                - Name: Tests
              RunOrder: 1

