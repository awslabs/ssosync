version: 0.2

env:
  variables:
    GO111MODULE: "on"
    git-credential-helper: yes            
    GOROOT:
    GOPATH:
    GOPROXY: direct
    git-credential-helper: yes
    #GOVERSION: go1.26.9
    #MOCKERY_VERSION: v3.5.2
    #GOLANGCI_LINT_VERSION: v2.3.1
    #GORELEASER_VERSION: v2.11.2
    #UPX_VERSION: v4.2.4
    # Set VERBOSE=1 for detailed build output, or override via CodeBuild environment
    VERBOSE: 0
phases:
  install: 
    commands:
      - GO_VERSION=$(sed -En 's/^go (.*)$/\1/p' go.mod ) 
      # Update the repos
      #- apt-get -qq --yes update && apt-get -qq --yes upgrade
      - BUILD_DIR=$PWD
      - cd /root/.goenv/plugins/go-build/../.. && git pull && cd -
      - cd /root/.goenv && git fetch --all && git pull
      - cd $BUILD_DIR
      # Only install the required Go version if it isn't already installed
      - |
        if goenv versions --bare | grep -qx "${GO_VERSION#go}"; then
          echo "Go ${GO_VERSION#go} already installed, skipping install"
        else
          echo "Go ${GO_VERSION#go} not installed, installing"
          goenv install ${GO_VERSION#go}
        fi
      - goenv global ${GO_VERSION#go}
      # Install development tools using Makefile (with verbose output if VERBOSE=1)
      - echo "Installing dependencies with VERBOSE=${VERBOSE}"
      - make install-deps
      - goenv rehash
      # Verify tool installations
      - make check-tools

  pre_build: 
    commands:
      # Print all environment variables (handy for AWS CodeBuild logs)
      - env
      - go version
      - GO_VERSION_INSTALLED=$(go version | sed -En 's/go version go(.*) (.*)$/\1/p')
      - '[ "${GO_VERSION_INSTALLED}" = "${GO_VERSION}" ] || (echo "Wrong go version" && exit 1)'

      # Output the EnvVars used in the build
      - echo "GitTag=${GitTag}"
      - echo "GitCommit=${GitCommit}"

      # Force replacement of these variables in config
      - envsubst < .goreleaser.yml >> .goreleaser.yml.tmp
      - mv .goreleaser.yml.tmp .goreleaser.yml
      - cat .goreleaser.yml
      
      # Setup project dependencies
      - make config

      # Check the Go code for common problems with 'go vet'
      - make vet
    exported-variables:
      - GO_VERSION

  build:
    commands:
      # Clean previous builds
      - make clean
      - make test

      # Build using goreleaser via Makefile
      - make go-build-lambda

  post_build:
    commands:
      # Check we've built something useful
      - find dist/ -name "ssosync*" -type f | head -5
      - echo "Build completed with VERBOSE=${VERBOSE}"

artifacts:
  files:
    - dist/**/*
cache:
  paths:
    - /root/.cache/go-build/**/*
    - "/go/pkg/**/*"
    - ".bin/**/*"  # Cache development tools installed by Makefile
  key: $GO_VERSION-$(codebuild-hash-files 'go.sum')